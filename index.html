<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小媛的食堂指南</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, "PingFang SC", "Noto Sans SC", sans-serif; min-height: 100vh; background: #f5f5f7; }
.tab-bar { position: sticky; top: 0; z-index: 100; background: linear-gradient(135deg, #ffb5c5, #ff8fa3); padding: 12px 16px; display: flex; gap: 8px; overflow-x: auto; }
.tab-btn { flex-shrink: 0; padding: 8px 16px; border: none; border-radius: 20px; background: rgba(255,255,255,0.3); color: white; font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.2s; }
.tab-btn.active { background: white; color: #ff6b8a; }
.tab-btn:hover { background: rgba(255,255,255,0.5); }
.iframe-wrap { width: 100%; height: calc(100vh - 60px); }
iframe { width: 100%; height: 100%; border: none; }
</style>
</head>
<body>
<div class="tab-bar">
  <button class="tab-btn active" data-ver="1-polka-dot">波点食光</button>
  <button class="tab-btn" data-ver="2-apple-minimal">媛味食集</button>
  <button class="tab-btn" data-ver="3-peach-bubble">蜜桃气泡</button>
</div>
<div class="iframe-wrap">
  <iframe id="frame" src="1-polka-dot/index.html"></iframe>
</div>
<script>
const tabs = document.querySelectorAll('.tab-btn');
const frame = document.getElementById('frame');
tabs.forEach(btn => {
  btn.addEventListener('click', () => {
    tabs.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    frame.src = btn.dataset.ver + '/index.html';
  });
});
</script>
</body>
</html>
