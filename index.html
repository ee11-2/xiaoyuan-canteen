<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="蜜桃食堂">
<meta name="theme-color" content="#FFC0CB">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%23FFC0CB'/><stop offset='1' stop-color='%23FF8C94'/></linearGradient></defs><rect width='180' height='180' rx='40' fill='url(%23g)'/><text x='90' y='112' font-size='100' text-anchor='middle'>🍑</text></svg>">
<title>呆呆大王的蜜桃食堂 🍑</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --peach-1:#FFE4E9;
  --peach-2:#FFC0CB;
  --peach-3:#FF8C94;
  --orange-1:#FFF1DC;
  --orange-2:#FFD79E;
  --orange-3:#FFA45C;
  --cream:#FFF9F5;
  --ink:#4A2F3A;
  --ink-soft:#8A6B78;
  --shadow:0 8px 28px rgba(255,140,148,.18);
  --radius:18px;
}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;color:var(--ink);background:var(--cream)}
body{
  background:
    radial-gradient(circle at 10% -10%, #FFD6E0 0, transparent 55%),
    radial-gradient(circle at 110% 10%, #FFE4C4 0, transparent 50%),
    radial-gradient(circle at 50% 120%, #FFC6D0 0, transparent 50%),
    var(--cream);
  overscroll-behavior:none;
  user-select:none;
}
/* ========== 欢迎页 ========== */
#welcome{
  position:fixed;inset:0;z-index:100;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:
    radial-gradient(circle at 20% 20%, #FFD3DE 0, transparent 45%),
    radial-gradient(circle at 80% 30%, #FFE2C2 0, transparent 45%),
    radial-gradient(circle at 50% 85%, #FFBFCB 0, transparent 55%),
    linear-gradient(160deg, #FFF1F3 0%, #FFE9DC 100%);
  transition:opacity .6s ease,transform .6s ease;
}
#welcome.fade-out{opacity:0;transform:scale(1.04);pointer-events:none}
.welcome-peach{
  width:180px;height:180px;margin-bottom:28px;position:relative;
  animation:bob 3s ease-in-out infinite;
}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.welcome-peach svg{width:100%;height:100%;filter:drop-shadow(0 18px 30px rgba(255,140,148,.35))}
.welcome-bubbles{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.bubble{
  position:absolute;border-radius:50%;
  background:radial-gradient(circle at 30% 30%, rgba(255,255,255,.85), rgba(255,192,203,.4) 60%, rgba(255,165,150,.25));
  box-shadow:inset -2px -4px 8px rgba(255,140,148,.25), 0 4px 12px rgba(255,140,148,.2);
  animation:rise linear infinite;
}
@keyframes rise{
  0%{transform:translateY(0) scale(1);opacity:0}
  15%{opacity:1}
  100%{transform:translateY(-80vh) scale(.8);opacity:0}
}
.welcome-title{
  font-size:34px;font-weight:800;
  background:linear-gradient(135deg, var(--peach-3), var(--orange-3));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  margin-bottom:10px;letter-spacing:1px;
}
.welcome-sub{font-size:15px;color:var(--ink-soft);margin-bottom:48px}
.welcome-btn{
  padding:15px 56px;border-radius:999px;border:none;cursor:pointer;
  background:linear-gradient(135deg, #FFB3C1 0%, #FFA45C 100%);
  color:white;font-size:17px;font-weight:600;letter-spacing:1px;
  box-shadow:0 10px 28px rgba(255,140,148,.4);
  transition:transform .2s ease,box-shadow .2s ease;
  animation:pulse 2.2s ease-in-out infinite;
}
.welcome-btn:active{transform:scale(.95)}
@keyframes pulse{0%,100%{box-shadow:0 10px 28px rgba(255,140,148,.4)}50%{box-shadow:0 14px 36px rgba(255,140,148,.55)}}

/* ========== 主布局 ========== */
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:calc(env(safe-area-inset-bottom) + 72px)}
.topbar{
  padding:14px 20px 10px;display:flex;align-items:center;justify-content:space-between;
  flex-shrink:0;
}
.brand{display:flex;align-items:center;gap:10px}
.brand-logo{
  width:40px;height:40px;border-radius:14px;
  background:linear-gradient(135deg, #FFB3C1, #FFA45C);
  display:flex;align-items:center;justify-content:center;font-size:22px;
  box-shadow:0 6px 14px rgba(255,140,148,.28);
}
.brand-text .hi{font-size:13px;color:var(--ink-soft)}
.brand-text .name{font-size:18px;font-weight:700;
  background:linear-gradient(135deg,var(--peach-3),var(--orange-3));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.top-actions{display:flex;gap:10px}
.icon-btn{
  width:40px;height:40px;border-radius:14px;border:none;background:rgba(255,255,255,.8);
  backdrop-filter:blur(10px);font-size:18px;cursor:pointer;
  box-shadow:0 4px 10px rgba(255,140,148,.12);
  transition:transform .15s;
}
.icon-btn:active{transform:scale(.92)}

/* Tabs */
.tabs{
  display:flex;gap:6px;padding:0 16px 12px;flex-shrink:0;overflow-x:auto;scrollbar-width:none
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  padding:9px 18px;border-radius:999px;border:none;flex-shrink:0;cursor:pointer;
  background:rgba(255,255,255,.7);font-size:14px;font-weight:600;color:var(--ink-soft);
  transition:all .2s ease;
}
.tab.active{
  background:linear-gradient(135deg,#FFB3C1,#FFA45C);color:white;
  box-shadow:0 6px 16px rgba(255,140,148,.32);
}

/* Sub tabs (楼层/档口/分类筛选) */
.sub-tabs{
  display:flex;gap:8px;padding:0 16px 12px;flex-shrink:0;overflow-x:auto;scrollbar-width:none
}
.sub-tabs::-webkit-scrollbar{display:none}
.sub-tab{
  padding:7px 14px;border-radius:999px;border:none;flex-shrink:0;cursor:pointer;
  background:rgba(255,255,255,.55);font-size:13px;color:var(--ink-soft);
  border:1.5px solid rgba(255,192,203,.4);
}
.sub-tab.active{background:#fff;color:var(--peach-3);border-color:var(--peach-3);font-weight:600}

/* 内容滚动区 */
.scroll{flex:1;overflow-y:auto;padding:4px 16px 20px;-webkit-overflow-scrolling:touch}
.scroll::-webkit-scrollbar{width:0}

.section-title{font-size:15px;font-weight:700;margin:8px 4px 12px;color:var(--ink)}
.section-title .count{font-size:12px;color:var(--ink-soft);font-weight:400;margin-left:6px}

/* 菜品卡片 */
.dish-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dish-card{
  background:#fff;border-radius:var(--radius);padding:12px;position:relative;
  box-shadow:var(--shadow);
  transition:transform .18s ease;display:flex;flex-direction:column;gap:8px;
  border:1.5px solid rgba(255,192,203,.25);
}
.dish-card:active{transform:scale(.97)}
.dish-emoji{
  width:100%;aspect-ratio:5/4;border-radius:12px;
  display:flex;align-items:center;justify-content:center;font-size:44px;
  background:linear-gradient(135deg,var(--g1,#FFE4E9),var(--g2,#FFD79E));
  position:relative;overflow:hidden;
}
.dish-emoji::after{
  content:"";position:absolute;width:80px;height:80px;border-radius:50%;
  background:rgba(255,255,255,.5);top:-20px;right:-20px;filter:blur(10px)
}
.dish-info{display:flex;flex-direction:column;gap:4px;min-height:0}
.dish-name{font-size:14px;font-weight:600;line-height:1.35;color:var(--ink);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dish-meta{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:2px}
.dish-price{font-size:15px;font-weight:700;color:var(--peach-3)}
.dish-shop{font-size:11px;color:var(--ink-soft);background:var(--peach-1);padding:3px 8px;border-radius:999px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:45%}
.dish-del{
  position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;
  background:rgba(255,100,120,.9);color:#fff;border:none;font-size:13px;
  display:none;align-items:center;justify-content:center;cursor:pointer;z-index:2;
}
.edit-mode .dish-del{display:flex}

/* 档口分组标题 */
.shop-group{margin:18px 0 10px}
.shop-header{
  display:flex;align-items:center;gap:8px;padding:0 2px;margin-bottom:10px;
}
.shop-badge{
  padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;color:#fff;
  background:linear-gradient(135deg,#FFB3C1,#FFA45C);
}
.shop-title{font-size:15px;font-weight:700;color:var(--ink);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shop-count{font-size:12px;color:var(--ink-soft)}

/* ========== 戳泡泡页 ========== */
#bubble-page{
  position:fixed;inset:0;z-index:80;background:
    radial-gradient(circle at 10% 10%, #FFE0EA 0, transparent 55%),
    radial-gradient(circle at 90% 20%, #FFE6CC 0, transparent 55%),
    radial-gradient(circle at 50% 100%, #FFCFDA 0, transparent 55%),
    linear-gradient(180deg, #FFF7F8 0%, #FFF1EA 100%);
  transform:translateY(100%);transition:transform .45s cubic-bezier(.22,1,.36,1);
  display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top);
}
#bubble-page.open{transform:translateY(0)}
.bubble-top{
  padding:16px 20px 8px;display:flex;align-items:center;justify-content:space-between;
}
.bubble-close{width:36px;height:36px;border-radius:50%;border:none;background:rgba(255,255,255,.8);font-size:18px;cursor:pointer;box-shadow:var(--shadow)}
.bubble-stage-title{font-size:16px;font-weight:700}
.bubble-tip{text-align:center;padding:6px 20px 12px;font-size:13px;color:var(--ink-soft)}
.bubble-canvas{flex:1;position:relative;overflow:hidden;margin:0 12px 0;border-radius:24px;background:
  radial-gradient(circle at 30% 20%, rgba(255,255,255,.7) 0, transparent 50%),
  linear-gradient(135deg, rgba(255,228,233,.6), rgba(255,233,210,.6));
  border:2px dashed rgba(255,165,150,.35);
}
.bubble-canvas .bb{
  position:absolute;border-radius:50%;cursor:pointer;
  display:flex;align-items:center;justify-content:center;text-align:center;
  background:radial-gradient(circle at 30% 30%, rgba(255,255,255,.92), rgba(255,192,203,.55) 60%, rgba(255,165,150,.35));
  box-shadow:inset -3px -6px 14px rgba(255,140,148,.25), 0 8px 24px rgba(255,140,148,.3);
  color:var(--ink);font-weight:700;font-size:14px;padding:4px;line-height:1.2;
  transition:transform .35s cubic-bezier(.34,1.56,.64,1),opacity .3s ease;
  animation:float 4s ease-in-out infinite;
}
@keyframes float{0%,100%{translate:0 0}50%{translate:0 -8px}}
.bubble-canvas .bb.pop{transform:scale(1.8);opacity:0}
.bubble-canvas .bb small{display:block;font-size:11px;font-weight:500;color:var(--ink-soft);margin-top:2px}
.bubble-count{text-align:center;padding:12px;font-size:13px;color:var(--ink-soft)}
.bubble-count b{color:var(--peach-3);font-weight:700;font-size:16px;margin:0 2px}
.bubble-reset{
  margin:4px 20px 14px;padding:14px;border-radius:16px;border:none;cursor:pointer;
  background:linear-gradient(135deg,#FFB3C1,#FFA45C);color:white;font-weight:600;font-size:15px;
  box-shadow:0 10px 24px rgba(255,140,148,.35);
}
.bubble-reset:disabled{opacity:.5;filter:grayscale(.3)}
/* 底部 Dock 栏 */
.dock{
  position:fixed;left:0;right:0;bottom:0;z-index:60;
  padding:10px 14px calc(env(safe-area-inset-bottom) + 10px);
  display:flex;gap:8px;justify-content:center;align-items:center;
  background:linear-gradient(180deg,transparent,rgba(255,230,235,.7) 30%,rgba(255,220,228,.95));
  backdrop-filter:blur(14px);
  transition:transform .35s cubic-bezier(.22,1,.36,1);
}
.dock.hidden{transform:translateY(120%)}
.dock-btn{
  flex:1;max-width:140px;height:58px;border-radius:18px;border:none;cursor:pointer;
  background:rgba(255,255,255,.9);color:var(--ink);font-size:13px;font-weight:600;
  box-shadow:0 10px 28px rgba(255,140,148,.25);
  display:flex;align-items:center;justify-content:center;gap:6px;
}
.dock-btn.primary{
  background:linear-gradient(135deg,#FFB3C1,#FFA45C);color:white;flex:1.2;max-width:170px;font-size:15px;
  box-shadow:0 12px 30px rgba(255,140,148,.42);
}
.dock-btn:active{transform:scale(.95)}
.dock-results{
  display:flex;gap:8px;overflow-x:auto;padding:0 6px;flex:1;max-width:calc(100vw - 190px);
  scrollbar-width:none;
}
.dock-results::-webkit-scrollbar{display:none}
.dock-result{
  flex-shrink:0;width:54px;height:54px;border-radius:16px;background:white;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  box-shadow:0 6px 16px rgba(255,140,148,.22);position:relative;font-size:22px;
  border:2px solid transparent;
}
.dock-result.selected{border-color:var(--peach-3)}
.dock-result small{position:absolute;bottom:2px;font-size:9px;color:var(--peach-3);font-weight:700;
  background:white;padding:0 4px;border-radius:999px}
.dock-result .r-rmb{position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;
  background:var(--peach-3);color:white;font-size:11px;display:flex;align-items:center;justify-content:center;border:none;cursor:pointer}

/* 选中菜品的弹窗详情 */
.detail-mask{position:fixed;inset:0;z-index:110;background:rgba(74,47,58,.45);display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px)}
.detail-mask.show{display:flex;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.detail-sheet{
  width:100%;max-width:480px;background:white;border-radius:28px 28px 0 0;padding:24px 22px calc(env(safe-area-inset-bottom) + 24px);
  animation:slideUp .3s cubic-bezier(.22,1,.36,1);max-height:80vh;overflow-y:auto;
}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.detail-sheet h3{font-size:22px;font-weight:700;margin-bottom:4px}
.detail-sheet .price{font-size:24px;font-weight:800;color:var(--peach-3);margin:10px 0}
.detail-sheet .shop-tag{display:inline-block;padding:5px 12px;border-radius:999px;background:var(--peach-1);color:var(--peach-3);font-size:13px;font-weight:600;margin-bottom:16px}
.detail-sheet .row{display:flex;gap:10px;margin-top:18px}
.detail-sheet .row button{flex:1;padding:14px;border-radius:14px;border:none;font-weight:600;font-size:14px;cursor:pointer}
.btn-ok{background:linear-gradient(135deg,#FFB3C1,#FFA45C);color:white;box-shadow:0 8px 20px rgba(255,140,148,.35)}
.btn-cancel{background:var(--peach-1);color:var(--peach-3)}

/* 添加菜品表单 */
.add-form{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.add-form label{font-size:13px;color:var(--ink-soft);font-weight:500}
.add-form input,.add-form select{
  padding:12px 14px;border-radius:12px;border:1.5px solid var(--peach-1);
  font-size:15px;background:var(--cream);font-family:inherit;outline:none;
  transition:border-color .2s;
}
.add-form input:focus,.add-form select:focus{border-color:var(--peach-3)}
.tag-chip{
  display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;
  background:var(--peach-1);font-size:13px;color:var(--peach-3);margin:0 8px 8px 0;
}
.tag-chip button{background:none;border:none;color:var(--peach-3);font-size:16px;cursor:pointer;padding:0;line-height:1}

/* 空状态 */
.empty{
  text-align:center;padding:50px 20px;color:var(--ink-soft);
}
.empty .emoji{font-size:56px;margin-bottom:14px}
.empty p{font-size:14px;line-height:1.7}

/* 编辑模式按钮组 */
.edit-banner{
  margin:0 16px 10px;padding:10px 14px;border-radius:14px;
  background:linear-gradient(135deg,rgba(255,179,193,.22),rgba(255,164,92,.22));
  font-size:13px;color:var(--peach-3);font-weight:600;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
}
.edit-banner button{
  padding:6px 14px;border-radius:999px;border:none;font-size:12px;font-weight:700;cursor:pointer;
}
.edit-banner .b-add{background:white;color:var(--peach-3)}
.edit-banner .b-done{background:var(--peach-3);color:white}

/* Toast */
.toast{
  position:fixed;top:20%;left:50%;transform:translateX(-50%) scale(.9);z-index:200;
  padding:12px 22px;border-radius:999px;background:rgba(74,47,58,.9);color:white;font-size:14px;font-weight:500;
  opacity:0;transition:all .3s ease;pointer-events:none;
}
.toast.show{opacity:1;transform:translateX(-50%) scale(1)}

/* 桌面端适配 */
@media(min-width:768px){
  #app,#welcome{max-width:480px;margin:0 auto;left:50%;transform:translateX(-50%);right:auto}
  #bubble-page{max-width:480px;margin:0 auto}
  .dock{max-width:480px;margin:0 auto}
  .dish-grid{grid-template-columns:repeat(3,1fr)}
}
</style>
</head>
<body>

<!-- 欢迎页 -->
<div id="welcome">
  <div class="welcome-bubbles" id="wbub"></div>
  <div class="welcome-peach">
    <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="pg" cx="35%" cy="35%" r="70%">
          <stop offset="0" stop-color="#FFE0C7"/>
          <stop offset="60%" stop-color="#FFB48A"/>
          <stop offset="100%" stop-color="#FF8F7A"/>
        </radialGradient>
        <linearGradient id="lg" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#8FD969"/>
          <stop offset="1" stop-color="#4CB050"/>
        </linearGradient>
      </defs>
      <ellipse cx="100" cy="112" rx="74" ry="68" fill="url(#pg)"/>
      <path d="M100 44 C96 28 108 22 120 30 C128 20 142 24 140 38 C138 46 128 50 118 48" fill="url(#lg)"/>
      <ellipse cx="78" cy="92" rx="18" ry="12" fill="rgba(255,255,255,.5)" transform="rotate(-20 78 92)"/>
    </svg>
  </div>
  <div class="welcome-title">欢迎呆呆大王</div>
  <div class="welcome-sub">🍑 蜜桃食堂 · 今天戳个泡泡决定吃什么</div>
  <button class="welcome-btn" onclick="enterApp()">进入食堂 🍽️</button>
</div>

<!-- 主应用 -->
<div id="app" style="display:none">
  <div class="topbar">
    <div class="brand">
      <div class="brand-logo">🍑</div>
      <div class="brand-text">
        <div class="hi">今天也要好好吃饭呀</div>
        <div class="name">呆呆大王的蜜桃食堂</div>
      </div>
    </div>
    <div class="top-actions">
      <button class="icon-btn" onclick="toggleEdit()" id="editBtn" title="编辑">✏️</button>
    </div>
  </div>

  <!-- 主分类 Tabs -->
  <div class="tabs" id="mainTabs">
    <button class="tab active" data-tab="floor">按楼层</button>
    <button class="tab" data-tab="cat">按品类</button>
    <button class="tab" data-tab="price">按价格</button>
  </div>

  <!-- 子分类 Sub Tabs -->
  <div class="sub-tabs" id="subTabs"></div>

  <div class="edit-banner" id="editBanner" style="display:none">
    <span>✏️ 编辑模式：可以删除和添加菜品</span>
    <div>
      <button class="b-add" onclick="showAddForm()">＋ 添加</button>
      <button class="b-done" onclick="toggleEdit()">完成</button>
    </div>
  </div>

  <!-- 内容区 -->
  <div class="scroll" id="content"></div>
</div>

<!-- 戳泡泡页 -->
<div id="bubble-page">
  <div class="bubble-top">
    <button class="bubble-close" onclick="closeBubble()">✕</button>
    <div class="bubble-stage-title" id="bTitle">第一步 · 选个品类</div>
    <div style="width:36px"></div>
  </div>
  <div class="bubble-tip" id="bTip">戳一下喜欢的品类泡泡，我再帮你挑具体菜～</div>
  <div class="bubble-canvas" id="bCanvas"></div>
  <div class="bubble-count">已选 <b id="pickCount">0</b> / 5 次</div>
  <button class="bubble-reset" id="bReset" onclick="resetBubbles()">重新开始 ↻</button>
</div>

<!-- 底部 Dock 栏 -->
<div class="dock hidden" id="dock">
  <div class="dock-results" id="dockResults"></div>
  <button class="dock-btn" onclick="openBubble()">🫧 戳泡泡</button>
  <button class="dock-btn primary" onclick="showSelected()">✨ 看结果</button>
</div>

<!-- 详情弹窗 -->
<div class="detail-mask" id="detailMask" onclick="if(event.target===this)closeDetail()">
  <div class="detail-sheet" id="detailSheet"></div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
/* ========== 数据与状态 ========== */
const CATS = [
  {name:'面类',emoji:'🍜',kws:['面','粉','米线','米粉','土豆粉','酸辣粉','螺蛳粉','朝鲜面','饸饹']},
  {name:'饭类',emoji:'🍚',kws:['饭','盖浇','双拼','卤肉','烤肉','拌饭','焖饭','滑蛋']},
  {name:'香锅/砂锅/小火锅',emoji:'🍲',kws:['麻辣香锅','锡纸','小火锅','砂锅','酥肉小锅','小锅','冒菜','麻辣拌','烫菜','罐罐','水煮']},
  {name:'特色小吃',emoji:'🥟',kws:['饼','夹馍','馅饼','包子','小笼包','生煎','锅贴','煎包','煎饺','饺子','菜煎饼','煎饼','烤冷面','卷煎饼','鸡蛋灌饼','月亮馍','烧麦','粘豆包','炸串','肉串']},
  {name:'馄饨/水饺',emoji:'🥟',kws:['馄饨','水饺','汤圆']},
  {name:'早餐/粥饮',emoji:'🥣',kws:['粥','豆浆','豆腐脑','豆汁','汤','茶','牛奶','米糊','馒头','花卷','油饼','三角鸡蛋饼','茶叶蛋','水煮蛋','茶蛋','蛋']}
];
const PRICE_TIERS = [
  {name:'6元以下',max:6,emoji:'💵'},
  {name:'6-10元',min:6,max:10,emoji:'💰'},
  {name:'10-15元',min:10,max:15,emoji:'🪙'},
  {name:'15元以上',min:15,emoji:'💎'}
];
const GRADS = [
  ['#FFE4E9','#FFD79E'],['#FFF1DC','#FFC6D0'],['#FFE9F0','#FFDEB5'],
  ['#FFEFF4','#FFE2CC'],['#FFF0F2','#FFE4C9'],['#FFEAF0','#FFDBAD']
];

let MENU = null;           // 原始菜单数据
let CUSTOM_DISHES = [];    // 本地新增的菜品
let DEL_DISHES = new Set(); // 删除的菜品ID
let state = {
  mainTab:'floor', subTab:'1F', edit:false,
  picks:[], bStage:1, bCat:null
};

/* ========== 初始化 ========== */
(async function init(){
  // 生成欢迎页泡泡
  makeWelcomeBubbles();
  // 加载菜单
  try{
    const r = await fetch('./data/menu.json');
    MENU = await r.json();
  }catch(e){ MENU={floors:[],shops_outside:[]}; }
  // 恢复本地数据
  try{
    CUSTOM_DISHES = JSON.parse(localStorage.getItem('peach_custom')||'[]');
    DEL_DISHES = new Set(JSON.parse(localStorage.getItem('peach_del')||'[]'));
  }catch(e){}
  // 注册 SW
  if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();

function makeWelcomeBubbles(){
  const box = document.getElementById('wbub');
  for(let i=0;i<14;i++){
    const b = document.createElement('div');
    b.className='bubble';
    const s = 20 + Math.random()*60;
    b.style.cssText = `width:${s}px;height:${s}px;left:${Math.random()*100}%;bottom:-100px;animation-duration:${4+Math.random()*6}s;animation-delay:${Math.random()*4}s`;
    box.appendChild(b);
  }
}

function enterApp(){
  document.getElementById('welcome').classList.add('fade-out');
  setTimeout(()=>{
    document.getElementById('welcome').style.display='none';
    document.getElementById('app').style.display='flex';
    document.getElementById('dock').classList.remove('hidden');
    renderSubTabs(); renderContent();
  },550);
}

/* ========== 获取所有菜品（含过滤、含自定义） ========== */
function getAllDishes(){
  const all = [];
  MENU.floors.forEach(f=>{
    f.shops.forEach(s=>{
      if(s.status==='closed') return;
      s.categories.forEach(c=>{
        c.dishes.forEach(d=>{
          if(DEL_DISHES.has(d.id)) return;
          if(!d.price) return;
          all.push({
            ...d, floor:f.id, floorName:f.name,
            shopName:s.name, shopId:s.id, catName:c.name
          });
        });
      });
    });
  });
  CUSTOM_DISHES.forEach(d=>all.push({...d,custom:true}));
  return all;
}

function catOf(dish){
  for(const c of CATS){
    for(const kw of c.kws){
      if(dish.name.includes(kw) || (dish.catName||'').includes(kw)) return c.name;
    }
  }
  return '其他';
}

/* ========== Tabs ========== */
document.getElementById('mainTabs').addEventListener('click',e=>{
  const b=e.target.closest('.tab');if(!b)return;
  [...e.currentTarget.children].forEach(c=>c.classList.remove('active'));
  b.classList.add('active');
  state.mainTab = b.dataset.tab;
  renderSubTabs(); renderContent();
});

function renderSubTabs(){
  const el = document.getElementById('subTabs'); el.innerHTML='';
  const make = (list,cur,key)=>{
    list.forEach(it=>{
      const b = document.createElement('button');
      b.className = 'sub-tab' + (it[key]===cur?' active':'');
      b.textContent = it.name + (it.count!==undefined?` (${it.count})`:'');
      b.onclick = ()=>{state.subTab=it[key];renderSubTabs();renderContent()};
      el.appendChild(b);
    });
  };
  if(state.mainTab==='floor'){
    const floors = MENU.floors.map(f=>({name:f.name,id:f.id}));
    make(floors,state.subTab,'id');
    // 追加档口
    const cur = MENU.floors.find(f=>f.id===state.subTab);
    if(cur){
      cur.shops.forEach(s=>{
        if(s.status==='closed') return;
        const n = s.name.replace(/^[一二三四五六七八九十0-9]+号\s*/,'').slice(0,10);
        const b = document.createElement('button');
        b.className = 'sub-tab' + (state.subTab===s.id?' active':'');
        b.textContent = n;
        b.onclick = ()=>{state.subTab=s.id;renderSubTabs();renderContent()};
        el.appendChild(b);
      });
    }
  }else if(state.mainTab==='cat'){
    make(CATS.map(c=>({name:c.emoji+' '+c.name,id:c.name})),state.subTab,'id');
    if(!CATS.find(c=>c.name===state.subTab)) state.subTab=CATS[0].name;
  }else if(state.mainTab==='price'){
    make(PRICE_TIERS.map(t=>({name:t.emoji+' '+t.name,id:t.name})),state.subTab,'id');
    if(!PRICE_TIERS.find(t=>t.name===state.subTab)) state.subTab=PRICE_TIERS[0].name;
  }
}

/* ========== 渲染内容 ========== */
function renderContent(){
  const el = document.getElementById('content');
  const all = getAllDishes();
  let list = [];
  let title = '', count=0;

  if(state.mainTab==='floor'){
    if(state.subTab.startsWith('1F') || state.subTab.startsWith('2F')){
      // 档口模式
      if(state.subTab.length<=3){
        // 整个楼层，按档口分组
        const floor = MENU.floors.find(f=>f.id===state.subTab);
        title = `${floor.name} · 所有档口`;
        list = all.filter(d=>d.floor===state.subTab);
        renderGrouped(el,list,title);
        return;
      }else{
        list = all.filter(d=>d.shopId===state.subTab);
        const s = all.find(d=>d.shopId===state.subTab);
        title = s? s.shopName : state.subTab;
      }
    }
  }else if(state.mainTab==='cat'){
    title = CATS.find(c=>c.name===state.subTab)?.name || '';
    list = all.filter(d=>catOf(d)===state.subTab);
  }else if(state.mainTab==='price'){
    const t = PRICE_TIERS.find(t=>t.name===state.subTab);
    title = t.name;
    list = all.filter(d=>{
      const p = d.price?.min_price ?? 999;
      if(t.max!==undefined && p>=t.max) return false;
      if(t.min!==undefined && p<t.min) return false;
      return true;
    });
  }
  count = list.length;
  el.innerHTML = `<div class="section-title">${title}<span class="count">共 ${count} 道</span></div>`;
  if(list.length===0){
    el.innerHTML += `<div class="empty"><div class="emoji">🫧</div><p>这个分类还没有菜品<br/>点右上角 ✏️ 添加你喜欢的吧</p></div>`;
    return;
  }
  el.innerHTML += renderDishGrid(list);
  bindDishCards();
}

function renderGrouped(el,list,title){
  // 按档口分组
  const groups = {};
  list.forEach(d=>{ (groups[d.shopId]??=[]).push(d); });
  let html = `<div class="section-title">${title}<span class="count">共 ${list.length} 道</span></div>`;
  const shopOrder = MENU.floors.flatMap(f=>f.shops.map(s=>s.id));
  const ids = Object.keys(groups).sort((a,b)=>shopOrder.indexOf(a)-shopOrder.indexOf(b));
  ids.forEach(id=>{
    const arr = groups[id];
    const s = arr[0];
    html += `<div class="shop-group">
      <div class="shop-header">
        <span class="shop-badge">${s.shopId.split('_')[1]}</span>
        <span class="shop-title">${s.shopName.replace(/^[一二三四五六七八九十0-9]+号\s*/,'')}</span>
        <span class="shop-count">${arr.length}道</span>
      </div>
      ${renderDishGrid(arr)}
    </div>`;
  });
  el.innerHTML = html;
  bindDishCards();
}

function renderDishGrid(list){
  let html = `<div class="dish-grid">`;
  list.forEach((d,i)=>{
    const cat = CATS.find(c=>c.name===catOf(d)) || {emoji:'🍽️'};
    const [g1,g2] = GRADS[i % GRADS.length];
    const price = d.price?.display || '';
    const shopShort = d.shopName?.replace(/^[一二三四五六七八九十0-9]+号\s*/,'').slice(0,8) || '';
    html += `<div class="dish-card" data-id="${d.id}" data-custom="${d.custom?1:0}">
      <button class="dish-del" data-id="${d.id}">×</button>
      <div class="dish-emoji" style="--g1:${g1};--g2:${g2}">${cat.emoji}</div>
      <div class="dish-info">
        <div class="dish-name">${d.name}</div>
        <div class="dish-meta">
          <span class="dish-price">¥${price.replace('元','')}</span>
          <span class="dish-shop" title="${d.shopName||''}">${shopShort}</span>
        </div>
      </div>
    </div>`;
  });
  html += `</div>`;
  return html;
}

function bindDishCards(){
  document.querySelectorAll('#app .dish-card').forEach(c=>{
    c.onclick = e=>{
      if(state.edit){
        // 编辑模式默认不显示详情
        return;
      }
      const id = c.dataset.id;
      const custom = c.dataset.custom==='1';
      const d = custom? CUSTOM_DISHES.find(x=>x.id===id) : getAllDishes().find(x=>x.id===id);
      if(d) showDetail(d);
    };
  });
  document.querySelectorAll('.dish-del').forEach(b=>{
    b.onclick = e=>{
      e.stopPropagation();
      deleteDish(b.dataset.id);
    };
  });
}

/* ========== 编辑：添加 / 删除 ========== */
function toggleEdit(){
  state.edit = !state.edit;
  document.getElementById('app').classList.toggle('edit-mode',state.edit);
  document.getElementById('editBanner').style.display = state.edit?'flex':'none';
  document.getElementById('editBtn').textContent = state.edit?'✓':'✏️';
  toast(state.edit?'进入编辑模式 ✏️':'已保存 💾');
}

function deleteDish(id){
  if(id.startsWith('custom_')){
    CUSTOM_DISHES = CUSTOM_DISHES.filter(d=>d.id!==id);
    localStorage.setItem('peach_custom', JSON.stringify(CUSTOM_DISHES));
  }else{
    DEL_DISHES.add(id);
    localStorage.setItem('peach_del', JSON.stringify([...DEL_DISHES]));
  }
  toast('已删除 🗑️');
  renderContent();
}

function showAddForm(){
  const floors = MENU.floors.map(f=>f.id);
  const shops = [];
  MENU.floors.forEach(f=>f.shops.forEach(s=>{
    if(s.status!=='closed') shops.push({id:s.id,name:s.name,floor:f.id});
  }));
  const sheet = document.getElementById('detailSheet');
  sheet.innerHTML = `
    <h3>✨ 添加菜品</h3>
    <div class="add-form">
      <label>菜品名称</label>
      <input id="aName" placeholder="比如：草莓奶冻">
      <label>价格（元）</label>
      <input id="aPrice" type="number" step="0.5" placeholder="比如：12">
      <label>所属档口</label>
      <select id="aShop">
        ${shops.map(s=>`<option value="${s.id}">${s.name}</option>`).join('')}
      </select>
      <label>分类标签</label>
      <div id="aTags">
        ${CATS.map(c=>`<span class="tag-chip" data-cat="${c.name}" onclick="this.dataset.sel=(this.dataset.sel==='1'?'0':'1');this.style.opacity=this.dataset.sel==='1'?1:.45">${c.emoji} ${c.name}<button type="button" onclick="event.stopPropagation()">×</button></span>`).join('')}
      </div>
      <div class="row">
        <button class="btn-cancel" onclick="closeDetail()">取消</button>
        <button class="btn-ok" onclick="submitAdd()">添加 🍽️</button>
      </div>
    </div>`;
  document.getElementById('detailMask').classList.add('show');
}

function submitAdd(){
  const name = document.getElementById('aName').value.trim();
  const price = parseFloat(document.getElementById('aPrice').value);
  const shopId = document.getElementById('aShop').value;
  if(!name){toast('请输入菜名');return;}
  if(!price || price<=0){toast('请输入价格');return;}
  const shop = MENU.floors.flatMap(f=>f.shops).find(s=>s.id===shopId);
  const dish = {
    id: 'custom_' + Date.now(),
    name,
    price:{min_price:price,max_price:price,display:price+'元'},
    shopId, shopName:shop.name,
    floor:shopId.startsWith('1F')?'1F':'2F',
    catName:'自定义', custom:true
  };
  CUSTOM_DISHES.push(dish);
  localStorage.setItem('peach_custom', JSON.stringify(CUSTOM_DISHES));
  closeDetail(); toast('添加成功 🍑'); renderContent();
}

/* ========== 详情 ========== */
function showDetail(d){
  const cat = CATS.find(c=>c.name===catOf(d)) || {emoji:'🍽️'};
  const sheet = document.getElementById('detailSheet');
  const price = d.price?.display || '';
  sheet.innerHTML = `
    <div class="dish-emoji" style="width:100%;aspect-ratio:16/9;border-radius:18px;font-size:74px;margin-bottom:16px;--g1:#FFE4E9;--g2:#FFD79E">${cat.emoji}</div>
    <h3>${d.name}</h3>
    <div class="shop-tag">📍 ${d.shopName||'自定义菜品'}${d.floor?' · '+(d.floor==='1F'?'一楼':'二楼'):''}</div>
    <div class="price">¥ ${price.replace('元','')}</div>
    <div style="color:var(--ink-soft);font-size:14px;line-height:1.7">
      戳「决定啦」把这道菜加入今天的选择～<br/>或者继续用戳泡泡找新惊喜 ✨
    </div>
    <div class="row">
      <button class="btn-cancel" onclick="closeDetail()">关闭</button>
      <button class="btn-ok" onclick="pickDirect('${d.id}',${d.custom?1:0})">决定啦 ✨</button>
    </div>`;
  document.getElementById('detailMask').classList.add('show');
}
function closeDetail(){document.getElementById('detailMask').classList.remove('show')}
function pickDirect(id,custom){
  const d = custom? CUSTOM_DISHES.find(x=>x.id===id) : getAllDishes().find(x=>x.id===id);
  if(state.picks.length>=5){toast('5次机会用完啦，去 Dock 里选吧～');return;}
  state.picks.push(d);
  updateDock(); closeDetail();
  toast('已加入今日菜单 🍽️');
}

/* ========== 戳泡泡 ========== */
function openBubble(){
  state.bStage = 1; state.bCat = null;
  document.getElementById('bubble-page').classList.add('open');
  refreshBubble();
}
function closeBubble(){document.getElementById('bubble-page').classList.remove('open')}

function refreshBubble(){
  const c = document.getElementById('bCanvas');
  const t = document.getElementById('bTitle');
  const tip = document.getElementById('bTip');
  const count = document.getElementById('pickCount');
  count.textContent = state.picks.length;
  c.innerHTML='';
  if(state.picks.length>=5){
    t.textContent = '已经选满 5 个啦';
    tip.textContent = '去底部 Dock 栏挑选最终决定吧～或者重新开始';
    c.innerHTML = `<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center;padding:20px;color:var(--ink-soft)">
      <div style="font-size:64px;margin-bottom:14px">🍽️</div>
      <div style="font-size:15px">点击下方「看结果」挑选今天吃什么</div>
    </div>`;
    document.getElementById('bReset').disabled = false;
    return;
  }
  let bubbles=[];
  if(state.bStage===1){
    t.textContent = `第一步 · 选品类 (${state.picks.length+1}/5)`;
    tip.textContent = '戳一个你想吃的品类泡泡';
    document.getElementById('bReset').disabled = state.picks.length===0;
    bubbles = CATS.map(c=>({label:c.emoji+'<br>'+c.name,data:c.name,size:78+Math.random()*40}));
  }else{
    const cat = state.bCat;
    const pool = getAllDishes().filter(d=>catOf(d)===cat);
    t.textContent = `第二步 · 选道${cat} (${state.picks.length+1}/5)`;
    tip.textContent = '戳中哪道就吃哪道！不满意可以重抽品类';
    document.getElementById('bReset').disabled = false;
    if(pool.length===0){
      c.innerHTML = `<div class="empty"><div class="emoji">😢</div><p>这个品类暂时没有菜品</p></div>`;
      return;
    }
    // 随机挑最多9道
    const shuffled = [...pool].sort(()=>Math.random()-.5).slice(0,9);
    bubbles = shuffled.map(d=>({
      label:`<b>${d.name.slice(0,5)}</b><small>¥${d.price.min_price}</small>`,
      data:d,
      size:70 + Math.random()*50
    }));
  }
  // 布局
  const W=c.clientWidth||360, H=c.clientHeight||400;
  bubbles.forEach((b,i)=>{
    const el = document.createElement('div');
    el.className='bb';
    el.style.width=el.style.height=b.size+'px';
    el.innerHTML=b.label;
    el.style.animationDelay = (i*0.15)+'s';
    // 找不重叠的位置
    let x,y,tries=0;
    do{
      x = 10 + Math.random()*(W-b.size-20);
      y = 10 + Math.random()*(H-b.size-20);
      tries++;
    }while(tries<40 && bubbles.slice(0,i).some((pb,pi)=>{
      const pxl = parseFloat(document.querySelectorAll('.bb')[pi]?.style.left||x);
      const pyl = parseFloat(document.querySelectorAll('.bb')[pi]?.style.top||y);
      const cx1=x+b.size/2,cy1=y+b.size/2;
      const cx2=pxl+bubbles[pi].size/2,cy2=pyl+bubbles[pi].size/2;
      const dx=cx1-cx2,dy=cy1-cy2;
      return Math.hypot(dx,dy) < (b.size+bubbles[pi].size)/2*0.85;
    }));
    el.style.left=x+'px';el.style.top=y+'px';
    el.onclick=()=>{
      el.classList.add('pop');
      setTimeout(()=>onBubblePop(b.data),280);
    };
    c.appendChild(el);
  });
}

function onBubblePop(data){
  if(state.bStage===1){
    state.bCat = data; state.bStage = 2;
    refreshBubble();
  }else{
    if(state.picks.length>=5){toast('5次机会用完啦');return;}
    state.picks.push(data);
    updateDock();
    toast(`🫧 抽到 ${data.name}！`);
    if(state.picks.length>=5){
      setTimeout(()=>{ closeBubble(); showSelected(); },800);
    }else{
      setTimeout(()=>{ state.bStage=1; state.bCat=null; refreshBubble(); },500);
    }
  }
}

function resetBubbles(){
  if(state.picks.length>0 && !confirm('清空已抽的 '+state.picks.length+' 个结果吗？')) return;
  state.picks = []; state.bStage = 1; state.bCat = null;
  updateDock(); refreshBubble();
}

/* ========== Dock 栏 ========== */
function updateDock(){
  const el = document.getElementById('dockResults');
  el.innerHTML='';
  if(state.picks.length===0){
    el.innerHTML = `<span style="font-size:12px;color:var(--ink-soft);padding:0 10px;white-space:nowrap">戳泡泡抽5次，再挑今天吃什么 →</span>`;
    return;
  }
  state.picks.forEach((d,i)=>{
    const cat = CATS.find(c=>c.name===catOf(d))||{emoji:'🍽️'};
    const b = document.createElement('div');
    b.className='dock-result';
    b.innerHTML = `${cat.emoji}<small>#${i+1}</small>
      <button class="r-rmb" onclick="rmPick(${i});event.stopPropagation()">×</button>`;
    b.onclick = ()=>showDetail(d);
    el.appendChild(b);
  });
}

function rmPick(i){
  state.picks.splice(i,1);
  updateDock();
  if(document.getElementById('bubble-page').classList.contains('open')) refreshBubble();
}

function showSelected(){
  if(state.picks.length===0){toast('还没有抽菜品哦，先戳泡泡吧 🫧');openBubble();return;}
  const sheet = document.getElementById('detailSheet');
  sheet.innerHTML = `<h3>✨ 今日候选 · ${state.picks.length} 选 1</h3>
    <div style="margin-top:14px;display:flex;flex-direction:column;gap:10px">
      ${state.picks.map((d,i)=>{
        const cat = CATS.find(c=>c.name===catOf(d))||{emoji:'🍽️'};
        return `<div class="dish-card" style="flex-direction:row;gap:12px;padding:12px">
          <div class="dish-emoji" style="width:72px;height:72px;aspect-ratio:1;font-size:30px;--g1:#FFE4E9;--g2:#FFD79E;flex-shrink:0">${cat.emoji}</div>
          <div style="flex:1;display:flex;flex-direction:column;justify-content:center;gap:4px;min-width:0">
            <div style="font-size:16px;font-weight:700">${i+1}. ${d.name}</div>
            <div style="font-size:13px;color:var(--ink-soft)">${d.shopName||'自定义'} · ${d.floor==='1F'?'一楼':'二楼'}</div>
            <div style="font-size:17px;font-weight:800;color:var(--peach-3);margin-top:2px">¥ ${d.price?.display?.replace('元','')||'-'}</div>
          </div>
        </div>`;
      }).join('')}
    </div>
    <div class="row">
      <button class="btn-cancel" onclick="closeDetail()">再想想</button>
      <button class="btn-ok" onclick="finalPick()">就决定啦 🎉</button>
    </div>`;
  document.getElementById('detailMask').classList.add('show');
}

function finalPick(){
  // 从已选中再随机一次，就是最终答案
  const winner = state.picks[Math.floor(Math.random()*state.picks.length)];
  const cat = CATS.find(c=>c.name===catOf(winner))||{emoji:'🍽️'};
  const sheet = document.getElementById('detailSheet');
  sheet.innerHTML = `
    <div style="text-align:center;padding:20px 0 10px">
      <div style="font-size:48px;animation:bob 2s ease-in-out infinite">🎉</div>
      <div style="font-size:14px;color:var(--ink-soft);margin-top:6px">经过蜜桃气泡的神秘力量……</div>
      <div style="font-size:20px;font-weight:800;margin:10px 0;
        background:linear-gradient(135deg,var(--peach-3),var(--orange-3));
        -webkit-background-clip:text;background-clip:text;color:transparent">
        今天就吃它啦！
      </div>
    </div>
    <div class="dish-emoji" style="width:100%;aspect-ratio:16/9;border-radius:18px;font-size:80px;margin:10px 0 16px;--g1:#FFE4E9;--g2:#FFD79E">${cat.emoji}</div>
    <h3 style="text-align:center">${winner.name}</h3>
    <div style="text-align:center">
      <div class="shop-tag">📍 ${winner.shopName||'自定义'} · ${winner.floor==='1F'?'一楼':'二楼'}</div>
    </div>
    <div class="price" style="text-align:center">¥ ${winner.price?.display?.replace('元','')||'-'}</div>
    <div style="text-align:center;color:var(--ink-soft);font-size:13px;padding:0 20px 10px;line-height:1.7">
      呆呆大王要好好吃饭哦 💗<br/>吃饱饱才有力气继续可爱！
    </div>
    <div class="row">
      <button class="btn-cancel" onclick="closeDetail();showSelected()">换一个</button>
      <button class="btn-ok" onclick="closeDetail();state.picks=[];updateDock();toast('祝用餐愉快 🍽️')">好嘞 ✨</button>
    </div>`;
}

/* ========== Toast ========== */
let toastT;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(()=>t.classList.remove('show'),1800);
}
</script>
</body>
</html>
