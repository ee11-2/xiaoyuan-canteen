<title>呆呆大王的食堂小馆 · Dot Dot Café</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --pink-50:#FFF3F7;
  --pink-100:#FFEDF3;
  --pink-200:#FFD9E5;
  --pink-300:#FFC2D5;
  --pink-400:#FF9FBE;
  --pink-500:#FF7FA8;
  --pink-600:#F0568D;
  --pink-700:#E8447C;
  --ink-900:#3A1A2A;
  --ink-700:#5C354A;
  --ink-500:#8A5C74;
  --ink-300:#B27A93;
  --ink-150:#CFA6B9;
  --white:#FFFFFF;
  --radius-s:10px;
  --radius-m:16px;
  --radius-l:22px;
  --radius-xl:28px;
  --radius-full:999px;
  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;
  --space-5:20px;--space-6:24px;--space-7:28px;--space-8:32px;
  --shadow-sm:0 2px 8px rgba(232,68,124,.08);
  --shadow-md:0 6px 20px rgba(232,68,124,.10);
  --shadow-lg:0 12px 36px rgba(232,68,124,.14);
  --shadow-xl:0 22px 60px rgba(232,68,124,.20);
  /* --- Liquid Glass 液态玻璃材质（iOS 风 · V2 强化版）--- */
  --glass-bg:        rgba(255,255,255,.50);
  --glass-bg-strong: rgba(255,255,255,.68);
  --glass-bg-deep:   rgba(255,255,255,.78);
  --glass-blur:      blur(34px) saturate(2.1) contrast(1.02);
  --glass-blur-xl:   blur(44px) saturate(2.25);
  --glass-border:    rgba(255,255,255,.58);
  --glass-border-strong: rgba(255,255,255,.80);
  /* 多层高光：顶部白虹 + 底部粉描边 + 左右极细折射 */
  --glass-hl-v2:
    inset 0 1.5px 0  rgba(255,255,255,.98),
    inset 0 -1.5px 0 rgba(255,210,228,.55),
    inset 1px 0 0   rgba(255,255,255,.35),
    inset -1px 0 0  rgba(255,255,255,.35),
    inset 0 0 0 1px rgba(255,255,255,.18);
  --glass-shadow:
    0 14px 40px rgba(180,50,100,.16),
    0 3px 10px rgba(180,50,100,.09),
    0 0 0 1px rgba(255,159,190,.12);
  --glass-shadow-lg:
    0 28px 72px rgba(180,50,100,.24),
    0 6px 16px rgba(180,50,100,.10),
    0 0 0 1px rgba(255,159,190,.15);
  /* 玻璃内部折射光晕（用于 search / chip 等交互元素） */
  --glass-aurora:
    radial-gradient(120% 80% at 20% 0%,  rgba(255,255,255,.35) 0%, rgba(255,255,255,0) 55%),
    radial-gradient(80% 60% at 90% 120%, rgba(255,200,220,.28) 0%, rgba(255,200,220,0) 60%);
}
html,body{height:100%;overflow:hidden}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  color:var(--ink-900);background:var(--pink-50);-webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;overscroll-behavior:none;user-select:none;
  position:relative;
}
/* 全局背景：模糊彩色 blob + 双层小波点 + 两处缓慢漂移光斑，给所有液态玻璃提供"折射底纹" */
body::before{
  content:"";position:fixed;inset:-8%;z-index:-2;pointer-events:none;
  background:
    radial-gradient(60% 55% at 12% 8%,  #FFD1E1 0%, rgba(255,209,225,0) 60%),
    radial-gradient(50% 50% at 88% 4%,  #FFC6DA 0%, rgba(255,198,218,0) 55%),
    radial-gradient(62% 60% at 100% 92%,#FFE3C9 0%, rgba(255,227,201,0) 60%),
    radial-gradient(55% 45% at 0% 100%,  #F4D4FF 0%, rgba(244,212,255,0) 60%),
    radial-gradient(60% 55% at 50% 50%,  #FFF4F8 0%, #FFEDF3 60%, #FFE3ED 100%);
  filter:saturate(1.1);
  animation:bgShift 22s ease-in-out infinite alternate;
}
@keyframes bgShift{
  0%  { transform:translate(0,0) scale(1);   filter:saturate(1.05) hue-rotate(0deg); }
  50% { transform:translate(-1.5%,1%) scale(1.03); filter:saturate(1.15) hue-rotate(-4deg); }
  100%{ transform:translate(1%,-1%) scale(1.02); filter:saturate(1.10) hue-rotate(3deg); }
}
body::after{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background-image:
    radial-gradient(rgba(255,159,190,.22) 2px, transparent 2.2px),
    radial-gradient(rgba(255,159,190,.12) 1.5px, transparent 1.7px);
  background-size: 26px 26px, 14px 14px;
  background-position: 0 0, 7px 9px;
  mix-blend-mode:multiply;
  opacity:.9;
  animation:dotsDrift 40s linear infinite;
}
@keyframes dotsDrift{
  0%  { background-position:0 0, 7px 9px; }
  100%{ background-position:52px 78px, 59px 87px; }
}
/* 全局浮动光斑 —— 提供玻璃折射的动态色源 */
body > .blob-a, body > .blob-b{
  position:fixed;border-radius:50%;pointer-events:none;z-index:-1;
  filter:blur(40px);opacity:.55;mix-blend-mode:screen;
}
body > .blob-a{
  width:380px;height:380px;left:-120px;top:-140px;
  background:radial-gradient(circle,#FFCFE0 0%, rgba(255,207,224,0) 70%);
  animation:blobA 26s ease-in-out infinite alternate;
}
body > .blob-b{
  width:320px;height:320px;right:-100px;top:30%;
  background:radial-gradient(circle,#FFE3C9 0%, rgba(255,227,201,0) 70%);
  animation:blobB 32s ease-in-out infinite alternate;
}
@keyframes blobA{
  0%{transform:translate(0,0) scale(1);}
  100%{transform:translate(60px,80px) scale(1.15);}
}
@keyframes blobB{
  0%{transform:translate(0,0) scale(1);}
  100%{transform:translate(-50px,-40px) scale(1.1);}
}
/* 液态玻璃通用工具类 V2 */
.glass{
  background:var(--glass-bg);
  backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);
  border:1px solid var(--glass-border);
  box-shadow:var(--glass-hl-v2), var(--glass-shadow);
}
.glass-strong{
  background:var(--glass-bg-strong);
  backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);
  border:1px solid var(--glass-border-strong);
  box-shadow:var(--glass-hl-v2), var(--glass-shadow-lg);
}
.glass-deep{
  background:var(--glass-bg-deep);
  backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);
  border:1px solid var(--glass-border-strong);
  box-shadow:var(--glass-hl-v2), var(--glass-shadow);
}
.pattern-dots{
  background-color:transparent;
  background-image:radial-gradient(var(--pink-200) 2.5px,transparent 2.6px);
  background-size:28px 28px;background-position:0 0;
}
/* 顶栏专用背景 V2：液态糖霜粉 —— 多层渐变 + 波点 + 三处流动高光团 + 极光带 */
.pattern-dots-lg{
  position:relative;overflow:hidden;
  background:
    /* 极光折射条带 */
    linear-gradient(115deg,
      rgba(255,255,255,0) 0%,
      rgba(255,255,255,.22) 25%,
      rgba(255,230,240,.40) 50%,
      rgba(255,255,255,.18) 75%,
      rgba(255,255,255,0) 100%
    ),
    /* 顶部高光云团 */
    radial-gradient(ellipse 90% 65% at 15% -10%, rgba(255,255,255,.60) 0%, rgba(255,255,255,0) 60%),
    radial-gradient(ellipse 70% 70% at 95% 10%, rgba(255,228,240,.95) 0%, rgba(255,228,240,0) 62%),
    /* 底部粉橙晕染 */
    radial-gradient(ellipse 55% 40% at 80% 110%, rgba(255,220,195,.75) 0%, rgba(255,220,195,0) 65%),
    radial-gradient(ellipse 45% 35% at 0% 105%,  rgba(255,205,228,.80) 0%, rgba(255,205,228,0) 60%),
    /* 波点 + 主色渐变 */
    radial-gradient(rgba(255,255,255,.55) 4px,transparent 4.3px) 0 0/44px 44px,
    linear-gradient(180deg,#FFC8DC 0%,#FFB3CD 28%,#FFA6C2 58%,#FFB9D3 85%,#FFCAE0 100%);
}
.pattern-dots-lg::before{
  /* 主光斑 —— 右上流动 */
  content:"";position:absolute;border-radius:50%;pointer-events:none;z-index:0;
  width:340px;height:340px;right:-140px;top:-180px;
  background:
    radial-gradient(circle at 35% 35%, rgba(255,255,255,.78), rgba(255,255,255,0) 58%),
    radial-gradient(circle at 65% 70%, rgba(255,220,235,.55), rgba(255,220,235,0) 60%);
  filter:blur(8px);opacity:.9;
  animation:orb1 14s ease-in-out infinite alternate;
}
.pattern-dots-lg::after{
  /* 次光斑 —— 左下流动 */
  content:"";position:absolute;left:-70px;top:18px;width:220px;height:220px;border-radius:50%;
  background:
    radial-gradient(circle at 50% 50%, rgba(255,240,248,.95), rgba(255,240,248,0) 70%);
  filter:blur(5px);opacity:.78;pointer-events:none;z-index:0;
  animation:orb2 18s ease-in-out infinite alternate;
}
@keyframes orb1{
  0%  { transform:translate(0,0) scale(1);    opacity:.85; }
  100%{ transform:translate(-26px,22px) scale(1.12); opacity:1; }
}
@keyframes orb2{
  0%  { transform:translate(0,0) scale(1);    opacity:.7; }
  100%{ transform:translate(18px,-14px) scale(1.08); opacity:.9; }
}
/* 顶栏额外中层光斑（粉紫） */
.pattern-dots-lg > .orb-mid{
  position:absolute;pointer-events:none;z-index:0;
  width:180px;height:180px;left:35%;top:30%;border-radius:50%;
  background:radial-gradient(circle, rgba(245,210,255,.55) 0%, rgba(245,210,255,0) 70%);
  filter:blur(14px);
  animation:orbMid 22s ease-in-out infinite alternate;
}
@keyframes orbMid{
  0%  { transform:translate(0,0); opacity:.55; }
  100%{ transform:translate(-32px,18px) scale(1.2); opacity:.78; }
}

/* ================== WELCOME ================== */
#welcome{
  position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;
  transition:opacity .55s cubic-bezier(.2,.8,.2,1),transform .55s cubic-bezier(.2,.8,.2,1);
}
#welcome.fade{opacity:0;transform:scale(1.03);pointer-events:none}
.wc{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 34px;text-align:center;width:100%}
.mascot-wrap{position:relative;margin-bottom:34px}
.mascot-ring{
  position:absolute;inset:-16px;border-radius:50%;
  border:2.5px dashed var(--pink-400);
  animation:ringSpin 18s linear infinite;
}
@keyframes ringSpin{to{transform:rotate(360deg)}}
.mascot{
  width:148px;height:148px;border-radius:50%;background:var(--white);
  box-shadow:0 18px 46px rgba(232,68,124,.18),inset 0 0 0 3px var(--pink-200);
  display:flex;align-items:center;justify-content:center;position:relative;
  animation:bob 4s ease-in-out infinite;
}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.kicker{
  font-size:11.5px;font-weight:800;letter-spacing:.34em;text-transform:uppercase;
  color:var(--pink-700);margin-bottom:14px;
}
.hello{
  font-size:44px;font-weight:900;letter-spacing:.01em;line-height:1.1;
  color:var(--ink-900);
}
.hello em{font-style:normal;color:var(--pink-600)}
.sub{
  margin-top:14px;font-size:15px;line-height:1.7;color:var(--ink-500);
  max-width:280px;
}
.start{
  margin-top:auto;margin-bottom:calc(env(safe-area-inset-bottom) + 34px);
  width:calc(100% - 68px);height:58px;border-radius:var(--radius-full);
  background:linear-gradient(150deg,var(--pink-400),var(--pink-600));color:var(--white);
  font-size:16px;font-weight:800;letter-spacing:.04em;border:none;cursor:pointer;
  box-shadow:0 14px 32px rgba(240,86,141,.38),inset 0 1px 0 rgba(255,255,255,.5);
  display:flex;align-items:center;justify-content:center;gap:10px;
  transition:transform .15s ease;
}
.start:active{transform:scale(.97)}
.skip{margin-top:14px;font-size:12.5px;color:var(--ink-300);font-weight:600;margin-bottom:0}

/* ================== SHELL ================== */
#app{
  position:fixed;inset:0;display:none;flex-direction:column;
  padding-top:env(safe-area-inset-top);
  padding-bottom:calc(env(safe-area-inset-bottom) + 82px);
}

/* ---- Top Header（液态玻璃顶栏 V2 · 极致紧凑移动端优化 V5） ---- */
.head{
  padding:7px 10px 9px;flex-shrink:0;position:relative;z-index:1;overflow:visible;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.45);
}
.edit-btn{
  width:30px;height:30px;border-radius:50%;position:relative;flex-shrink:0;
  background:rgba(255,255,255,.72);
  backdrop-filter:blur(22px) saturate(1.95);-webkit-backdrop-filter:blur(22px) saturate(1.95);
  border:1px solid rgba(255,255,255,.88);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.98),
    inset 0 -1px 0 rgba(255,210,228,.55),
    0 7px 16px rgba(160,40,90,.22),
    0 0 0 1px rgba(255,159,190,.18);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  color:var(--pink-600);font-size:14px;transition:transform .15s ease;
}
.edit-btn:active{transform:scale(.92)}
.edit-btn.on{
  background:linear-gradient(150deg,var(--pink-400),var(--pink-600));
  color:#fff;
}
.head::before,.head::after{display:none}
.greet{display:flex;align-items:center;justify-content:space-between;gap:6px;position:relative;z-index:2}
.g-lbl{
  font-size:7.5px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;
  color:rgba(255,255,255,.98);
  text-shadow:0 1px 2px rgba(200,60,110,.28), 0 0 14px rgba(255,255,255,.25);
}
.g-title{
  font-size:16.5px;font-weight:900;letter-spacing:-.015em;
  color:#fff;margin-top:1px;
  text-shadow:
    0 2px 16px rgba(160,40,90,.34),
    0 0 24px rgba(255,255,255,.18);
}
.ava{
  width:30px;height:30px;border-radius:50%;position:relative;
  background:rgba(255,255,255,.72);
  backdrop-filter:blur(22px) saturate(1.95);-webkit-backdrop-filter:blur(22px) saturate(1.95);
  border:1px solid rgba(255,255,255,.88);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.98),
    inset 0 -1px 0 rgba(255,210,228,.55),
    0 7px 16px rgba(160,40,90,.22),
    0 0 0 1px rgba(255,159,190,.18);
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:900;color:var(--pink-600);flex-shrink:0;
  animation:avaFloat 5.5s ease-in-out infinite;
}
@keyframes avaFloat{
  0%,100%{ transform:translateY(0); }
  50%    { transform:translateY(-2px); }
}
.ava::after{
  content:"";position:absolute;top:5px;left:8px;width:13px;height:7px;border-radius:50%;
  background:rgba(255,255,255,.98);filter:blur(1.2px);opacity:.82;
}
/* 头像外圈柔和光晕 */
.ava::before{
  content:"";position:absolute;inset:-4px;border-radius:50%;
  background:radial-gradient(circle, rgba(255,255,255,.55), rgba(255,255,255,0) 65%);
  pointer-events:none;z-index:-1;opacity:.9;
}
.search{
  margin-top:6px;height:36px;border-radius:18px;position:relative;z-index:2;
  background:
    var(--glass-aurora),
    rgba(255,255,255,.70);
  backdrop-filter:blur(28px) saturate(2.05) contrast(1.02);
  -webkit-backdrop-filter:blur(28px) saturate(2.05) contrast(1.02);
  border:1px solid rgba(255,255,255,.88);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.98),
    inset 0 -1px 0 rgba(255,210,228,.55),
    inset 1px 0 0 rgba(255,255,255,.35),
    inset -1px 0 0 rgba(255,255,255,.35),
    0 8px 20px rgba(160,40,90,.16),
    0 1px 5px rgba(160,40,90,.05),
    0 0 0 1px rgba(255,159,190,.16);
  display:flex;align-items:center;gap:6px;
  padding:0 13px;color:var(--ink-500);font-size:11.5px;font-weight:600;
  transition:transform .18s ease, box-shadow .22s ease;
}
.search::before{
  content:"";position:absolute;top:2.5px;left:18px;right:18px;height:11px;border-radius:11px;
  background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(255,255,255,0) 80%);
  opacity:.88;pointer-events:none;
}
.search::after{
  content:"";position:absolute;left:20px;right:20px;bottom:4px;height:8px;border-radius:50%;
  background:radial-gradient(50% 100% at 50% 100%, rgba(255,180,210,.45), rgba(255,180,210,0) 70%);
  filter:blur(2px);opacity:.75;pointer-events:none;
}
.search svg{flex-shrink:0}
.search input{
  flex:1;border:none;background:transparent;outline:none;
  font-size:11.5px;font-weight:600;color:var(--ink-900);
  font-family:inherit;min-width:0;
}
.search input::placeholder{color:var(--ink-300);font-weight:600}
.search .clear-btn{
  width:16px;height:16px;border-radius:50%;border:none;cursor:pointer;
  background:var(--pink-200);color:var(--pink-700);font-size:10px;font-weight:800;
  display:none;align-items:center;justify-content:center;flex-shrink:0;
  line-height:1;padding:0;
}
.search.has-text .clear-btn{display:flex}
.search:focus-within{
  transform:scale(.995);
  box-shadow:
    inset 0 1.5px 0 rgba(255,255,255,.98),
    inset 0 -1.5px 0 rgba(255,210,228,.5),
    0 12px 28px rgba(160,40,90,.20),
    0 0 0 1px rgba(255,159,190,.25);
}

/* ---- Content Card（液态玻璃"浮出"效果 V2 · 极致紧凑移动端优化 V5） ---- */
.body{
  flex:1;margin:0 7px 0;position:relative;overflow:hidden;display:flex;flex-direction:column;
  border-radius:20px 20px 17px 17px / 20px 20px 15px 15px;
  background:
    var(--glass-aurora),
    rgba(255,255,255,.66);
  backdrop-filter:blur(34px) saturate(2.0) contrast(1.02);
  -webkit-backdrop-filter:blur(34px) saturate(2.0) contrast(1.02);
  border:1px solid rgba(255,255,255,.84);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.98),
    inset 0 -1px 0 rgba(255,210,228,.55),
    inset 1px 0 0 rgba(255,255,255,.3),
    inset -1px 0 0 rgba(255,255,255,.3),
    0 -4px 24px rgba(160,40,90,.06),
    0 14px 38px rgba(160,40,90,.11),
    0 0 0 1px rgba(255,159,190,.14);
  padding:7px 0 0;
  animation:bodyFloat 9s ease-in-out infinite;
}
@keyframes bodyFloat{
  0%,100%{ transform:translateY(0); }
  50%    { transform:translateY(-2px); }
}
.body::before{
  content:"";position:absolute;top:6px;left:50%;transform:translateX(-50%);
  width:34px;height:3.5px;border-radius:3.5px;
  background:linear-gradient(180deg,rgba(255,159,190,.7),rgba(255,159,190,.45));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.85), 0 1px 2px rgba(160,40,90,.12);
}
.body::after{
  content:"";position:absolute;top:0;left:20px;right:20px;height:1px;border-radius:1px;
  background:linear-gradient(90deg,transparent 0%,rgba(255,255,255,.98) 20%,rgba(255,255,255,.98) 80%,transparent 100%);
  opacity:.75;pointer-events:none;
}

/* Floor Segmented Control（液态玻璃 V2 · 极致紧凑移动端优化 V5） */
.seg-wrap{padding:0 10px 0;flex-shrink:0}
.seg{
  display:grid;grid-template-columns:1fr 1fr;
  background:
    var(--glass-aurora),
    rgba(255,255,255,.50);
  backdrop-filter:blur(24px) saturate(1.9);-webkit-backdrop-filter:blur(24px) saturate(1.9);
  border:1px solid rgba(255,255,255,.8);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.96),
    inset 0 -1px 0 rgba(255,210,228,.5),
    0 4px 14px rgba(160,40,90,.07),
    0 0 0 1px rgba(255,159,190,.12);
  border-radius:14px;padding:3px;gap:3px;
}
.seg button{
  border:none;padding:5px 0;border-radius:11px;background:transparent;
  font-size:10.5px;font-weight:700;color:var(--ink-500);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:0.5px;
  transition:all .24s cubic-bezier(.2,.9,.2,1.12);
  position:relative;
}
.seg button small{font-size:7.5px;font-weight:600;opacity:.78}
.seg button.on{
  background:
    linear-gradient(180deg,rgba(255,255,255,.98),rgba(255,255,255,.90)),
    #fff;
  color:var(--pink-600);
  box-shadow:
    inset 0 1.2px 0 rgba(255,255,255,1),
    inset 0 -1.2px 0 rgba(255,200,220,.6),
    inset 0 0 0 1px rgba(255,159,190,.12),
    0 6px 18px rgba(240,86,141,.16);
  transform:translateY(-1px) scale(1.005);
}
.seg button.on::after{
  content:"";position:absolute;top:2.5px;left:16%;right:16%;height:5.5px;border-radius:5.5px;
  background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(255,255,255,0));
  opacity:.9;pointer-events:none;
}

/* Chips（液态玻璃 pill V2 · 极致紧凑移动端优化 V5） */
.chips{
  display:flex;gap:5px;padding:6px 10px 5px;overflow-x:auto;scrollbar-width:none;
  flex-shrink:0;
}
.chips::-webkit-scrollbar{display:none}
.chip{
  padding:4.5px 9px;border-radius:var(--radius-full);flex-shrink:0;cursor:pointer;position:relative;
  background:
    var(--glass-aurora),
    rgba(255,255,255,.56);
  backdrop-filter:blur(18px) saturate(1.85);-webkit-backdrop-filter:blur(18px) saturate(1.85);
  border:1px solid rgba(255,255,255,.85);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.95),
    inset 0 -1px 0 rgba(255,210,228,.5),
    0 3px 10px rgba(160,40,90,.06),
    0 0 0 1px rgba(255,159,190,.10);
  font-size:9.5px;font-weight:700;color:var(--ink-500);
  transition:all .2s cubic-bezier(.2,.9,.2,1.12);white-space:nowrap;
}
.chip.on{
  background:
    linear-gradient(180deg,rgba(255,255,255,.96),rgba(255,246,250,.92)),
    #fff;
  color:var(--pink-600);
  box-shadow:
    inset 0 1.2px 0 rgba(255,255,255,1),
    inset 0 -1.2px 0 rgba(255,198,218,.55),
    inset 0 0 0 1px rgba(255,159,190,.18),
    0 9px 22px rgba(240,86,141,.22);
  transform:translateY(-1px);
}
.chip.on::after{
  content:"";position:absolute;left:10%;right:10%;top:2.5px;height:5px;border-radius:5px;
  background:linear-gradient(180deg,#FFD7E6,rgba(255,215,230,0));opacity:.95;pointer-events:none;
}

/* Section header（液态玻璃标题条 V2 · 极致紧凑移动端优化 V5） */
.sec-head{
  margin:0px 10px 3px;padding:4px 8px;
  border-radius:11px;flex-shrink:0;
  background:
    var(--glass-aurora),
    rgba(255,255,255,.40);
  backdrop-filter:blur(16px) saturate(1.8);-webkit-backdrop-filter:blur(16px) saturate(1.8);
  border:1px solid rgba(255,255,255,.82);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.94),
    inset 0 -1px 0 rgba(255,210,228,.48),
    0 2px 7px rgba(160,40,90,.04);
  display:flex;align-items:baseline;justify-content:space-between;
}
.sec-head b{
  font-size:10.5px;font-weight:800;color:var(--ink-900);display:flex;align-items:center;gap:4.5px;
}
.dot-trio{display:inline-flex;gap:2px;align-items:center}
.dot-trio i{display:block;border-radius:50%}
.dot-trio i:nth-child(1){width:4px;height:4px;background:var(--pink-500);box-shadow:0 0 4px rgba(255,127,168,.5)}
.dot-trio i:nth-child(2){width:3px;height:3px;background:var(--pink-300)}
.dot-trio i:nth-child(3){width:2px;height:2px;background:var(--pink-200)}
.sec-head span{font-size:8.5px;font-weight:700;color:var(--ink-300)}

/* Scroll area · 极致紧凑优化 V5 */
.list{flex:1;overflow-y:auto;padding:0 10px 8px;-webkit-overflow-scrolling:touch}
.list::-webkit-scrollbar{width:0}

/* Edit banner（液态玻璃 V2 · 极致紧凑优化 V5） */
.edit-banner{
  margin:0 10px 4px;padding:5px 8px;border-radius:11px;
  background:
    var(--glass-aurora),
    rgba(255,255,255,.58);
  backdrop-filter:blur(18px) saturate(1.85);-webkit-backdrop-filter:blur(18px) saturate(1.85);
  border:1px solid rgba(255,255,255,.86);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.96),
    inset 0 -1px 0 rgba(255,210,228,.5),
    0 4px 14px rgba(160,40,90,.07);
  display:flex;align-items:center;justify-content:space-between;gap:5px;
  font-size:9.5px;font-weight:700;color:var(--pink-700);flex-shrink:0;
}
.edit-banner::before{
  content:"";position:absolute;display:none
}
.edit-banner button{
  padding:3.5px 8px;border-radius:var(--radius-full);border:none;
  font-size:9px;font-weight:800;cursor:pointer;position:relative;
}
.b-add{
  background:rgba(255,255,255,.94);color:var(--pink-600);
  box-shadow:
    inset 0 1px 0 #fff,
    inset 0 -1px 0 rgba(255,200,220,.5),
    0 4px 12px rgba(240,86,141,.15);
}
.b-done{
  background:linear-gradient(150deg,var(--pink-400),var(--pink-600));color:#fff;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.52),
    inset 0 -1px 0 rgba(160,40,90,.18),
    0 8px 18px rgba(240,86,141,.32);
}

/* Dish row（液态玻璃卡片 V2 · 极致紧凑移动端优化 V5） */
.dish{
  display:flex;align-items:center;gap:8px;padding:6px;margin-bottom:4px;position:relative;
  background:
    var(--glass-aurora),
    rgba(255,255,255,.66);
  backdrop-filter:blur(22px) saturate(1.9);-webkit-backdrop-filter:blur(22px) saturate(1.9);
  border-radius:14px;
  border:1px solid rgba(255,255,255,.86);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.98),
    inset 0 -1px 0 rgba(255,210,228,.52),
    inset 1px 0 0 rgba(255,255,255,.3),
    inset -1px 0 0 rgba(255,255,255,.3),
    0 5px 15px rgba(160,40,90,.07),
    0 0 0 1px rgba(255,159,190,.12);
  transition:transform .18s ease, box-shadow .22s ease;
}
.dish:active{
  transform:scale(.985);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.98),
    inset 0 -1px 0 rgba(255,210,228,.45),
    0 3px 10px rgba(160,40,90,.06),
    0 0 0 1px rgba(255,159,190,.12);
}
.thumb{
  width:44px;height:44px;border-radius:12px;flex-shrink:0;overflow:hidden;position:relative;
  display:flex;align-items:center;justify-content:center;font-size:19px;
  background:linear-gradient(135deg,#FFF1F6,#FFF4E5);
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.92),
    inset 0 1px 0 rgba(255,255,255,.98),
    0 3px 9px rgba(255,159,190,.15);
}
.thumb::before{
  content:"";position:absolute;top:3px;left:5.5px;right:5.5px;height:8px;border-radius:8px;
  background:linear-gradient(180deg,rgba(255,255,255,.96),rgba(255,255,255,0));
  opacity:.85;pointer-events:none;z-index:2;
}
.thumb::after{
  content:"";position:absolute;inset:0;border-radius:14px;
  background-image:radial-gradient(rgba(255,180,210,.42) 1.5px,transparent 1.7px);
  background-size:10px 10px;background-position:5px 5px;opacity:.58;pointer-events:none;
}
.thumb .badge{
  position:absolute;top:3px;left:3px;z-index:3;
  font-size:6.5px;font-weight:800;letter-spacing:.04em;color:var(--white);
  background:linear-gradient(150deg,var(--pink-500),var(--pink-600));padding:2px 5px;border-radius:var(--radius-full);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.48),
    inset 0 -1px 0 rgba(160,40,90,.2),
    0 2px 6px rgba(240,86,141,.28);
}
.info{flex:1;min-width:0}
.dname{
  font-size:12px;font-weight:800;color:var(--ink-900);
  line-height:1.2;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.ddesc{
  font-size:8.5px;font-weight:600;color:var(--ink-300);margin-top:1.5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.price{
  font-size:12.5px;font-weight:900;color:var(--pink-600);letter-spacing:-.01em;
  flex-shrink:0;
}
.price em{font-style:normal;font-size:8px;margin-right:0.5px;font-weight:700}
.del-x{
  position:absolute;top:3px;right:3px;width:18px;height:18px;border-radius:50%;
  background:rgba(240,86,141,.92);color:var(--white);border:none;
  font-size:10px;display:none;align-items:center;justify-content:center;cursor:pointer;z-index:5;
}
.edit-mode .del-x{display:flex}

/* Shop group heading · 极致紧凑优化 V5 */
.shop-h{
  display:flex;align-items:center;gap:5px;padding:7px 3px 3px;
}
.shop-h b{
  padding:2px 6.5px;border-radius:var(--radius-full);font-size:8.5px;font-weight:800;color:var(--white);
  background:linear-gradient(150deg,var(--pink-400),var(--pink-600));
  box-shadow:0 2px 6px rgba(240,86,141,.20);letter-spacing:.04em;
}
.shop-h .st{font-size:10.5px;font-weight:800;color:var(--ink-900);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shop-h .sc{font-size:8px;font-weight:600;color:var(--ink-300)}

/* Group separator */
.gap{height:2px}

/* ================== Tabbar (新设计 · 72px 高 · 4 项布局 · 更厚毛玻璃) ================== */
.tabbar{
  position:fixed;left:8px;right:8px;
  bottom:calc(env(safe-area-inset-bottom) + 8px);
  height:72px;border-radius:36px;z-index:80;
  background:
    var(--glass-aurora),
    rgba(255,255,255,.88);
  backdrop-filter:blur(40px) saturate(2.3);-webkit-backdrop-filter:blur(40px) saturate(2.3);
  border:1.5px solid rgba(255,255,255,.95);
  box-shadow:
    inset 0 1.5px 0 rgba(255,255,255,.98),
    inset 0 -1.5px 0 rgba(255,210,228,.55),
    inset 1px 0 0 rgba(255,255,255,.4),
    inset -1px 0 0 rgba(255,255,255,.4),
    0 18px 44px rgba(200,60,110,.22),
    0 4px 14px rgba(200,60,110,.08),
    0 0 0 1px rgba(255,159,190,.20);
  display:flex;align-items:center;padding:0 8px;
  animation:tbFloat 7s ease-in-out infinite;
}
@keyframes tbFloat{
  0%,100%{ transform:translateY(0); }
  50%    { transform:translateY(-1.5px); }
}
.tb-item{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
  color:var(--ink-300);font-size:10px;font-weight:700;cursor:pointer;
  transition:transform .2s ease, color .2s ease;
  padding:4px 0;
}
.tb-item svg{width:26px;height:26px}
.tb-item.on{
  color:var(--pink-600);
  transform:translateY(-2px);
}
.tb-item.on svg{filter:drop-shadow(0 4px 8px rgba(240,86,141,.3))}
.tb-item .tb-lbl{font-size:10px;font-weight:700;margin-top:1px}
.tb-gacha{
  width:58px;height:58px;border-radius:50%;margin:0 4px;flex-shrink:0;
  background:linear-gradient(150deg,var(--pink-400),var(--pink-600));
  box-shadow:
    inset 0 2px 0 rgba(255,255,255,.55),
    inset 0 -2px 0 rgba(160,40,90,.22),
    inset 0 0 0 1px rgba(255,255,255,.2),
    0 12px 28px rgba(240,86,141,.40);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  transition:transform .18s ease, box-shadow .2s ease;
  position:relative;
}
.tb-gacha::before{
  content:"";position:absolute;inset:-4px;border-radius:50%;
  background:radial-gradient(circle, rgba(255,180,210,.55), rgba(255,180,210,0) 65%);
  z-index:-1;opacity:.8;
}
.tb-gacha:active{transform:scale(.93)}
.tb-gacha svg{width:32px;height:32px;animation:bob 3s ease-in-out infinite}
.tb-gacha .tb-badge{
  position:absolute;top:-2px;right:-2px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;
  background:var(--white);color:var(--pink-600);font-size:9px;font-weight:900;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 10px rgba(240,86,141,.3);
}

/* Gacha 专属底部栏 */
.g-tabbar{
  position:absolute;left:8px;right:8px;
  bottom:calc(env(safe-area-inset-bottom) + 8px);
  height:60px;border-radius:30px;z-index:85;
  background:
    var(--glass-aurora),
    rgba(255,255,255,.88);
  backdrop-filter:blur(40px) saturate(2.3);-webkit-backdrop-filter:blur(40px) saturate(2.3);
  border:1.5px solid rgba(255,255,255,.95);
  box-shadow:
    inset 0 1.5px 0 rgba(255,255,255,.98),
    inset 0 -1.5px 0 rgba(255,210,228,.55),
    0 18px 44px rgba(200,60,110,.22);
  display:flex;align-items:center;padding:0 10px;gap:8px;
}
.g-tabbar button{
  flex:1;height:44px;border-radius:22px;border:none;cursor:pointer;
  font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:6px;
  transition:transform .15s ease, opacity .2s ease;
}
.g-tabbar button:active{transform:scale(.96)}
.g-tabbar .g-btn-view{
  background:linear-gradient(150deg,var(--pink-400),var(--pink-600));color:#fff;
  box-shadow:0 8px 20px rgba(240,86,141,.32),inset 0 1px 0 rgba(255,255,255,.5);
}
.g-tabbar .g-btn-clear{
  background:rgba(255,255,255,.92);color:var(--pink-600);
  box-shadow:inset 0 1px 0 #fff,inset 0 -1px 0 rgba(255,200,220,.5),0 4px 12px rgba(160,40,90,.12);
}

/* 收藏按钮（详情页） */
.fav-btn{
  position:absolute;top:14px;right:14px;width:44px;height:44px;border-radius:50%;
  background:rgba(255,255,255,.95);border:2px solid rgba(255,255,255,.98);
  backdrop-filter:blur(20px) saturate(1.8);-webkit-backdrop-filter:blur(20px) saturate(1.8);
  box-shadow:0 8px 20px rgba(200,60,110,.18);
  display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:4;
  transition:transform .2s ease, background .2s ease;
}
.fav-btn:active{transform:scale(.9)}
.fav-btn.on{
  background:linear-gradient(150deg,var(--pink-400),var(--pink-600));
  border-color:rgba(255,255,255,.5);
}
.fav-btn svg{width:22px;height:22px;color:var(--pink-300)}
.fav-btn.on svg{color:#fff;fill:#fff}

/* 备注区域（详情页） */
.notes-section{margin-top:18px}
.notes-section h{
  font-size:13px;font-weight:800;color:var(--ink-900);margin-bottom:8px;
  display:flex;align-items:center;gap:6px;
}
.notes-section h .nc{font-size:10px;color:var(--ink-300);font-weight:600}
.note-tags{display:flex;flex-wrap:wrap;gap:6px}
.note-tag{
  padding:6px 11px;border-radius:var(--radius-full);font-size:11.5px;font-weight:700;
  background:var(--pink-50);color:var(--ink-500);border:1.5px solid var(--pink-100);
  cursor:pointer;transition:all .15s ease;display:flex;align-items:center;gap:3px;
}
.note-tag.on{
  background:linear-gradient(150deg,var(--pink-400),var(--pink-600));color:#fff;
  border-color:transparent;box-shadow:0 4px 12px rgba(240,86,141,.25);
}
.note-textarea{
  margin-top:10px;width:100%;min-height:60px;padding:10px 12px;
  border-radius:14px;border:1.5px solid var(--pink-100);
  font-size:12.5px;background:var(--pink-50);font-family:inherit;color:var(--ink-900);
  outline:none;resize:none;transition:border-color .2s ease;line-height:1.6;
}
.note-textarea:focus{border-color:var(--pink-400)}
.note-textarea::placeholder{color:var(--ink-300)}

/* 收藏清单页 */
.fav-list{padding:0 10px 8px}
.fav-item{
  display:flex;align-items:center;gap:10px;padding:10px;margin-bottom:6px;border-radius:14px;
  background:
    var(--glass-aurora),
    rgba(255,255,255,.66);
  backdrop-filter:blur(22px) saturate(1.9);-webkit-backdrop-filter:blur(22px) saturate(1.9);
  border:1px solid rgba(255,255,255,.86);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.98),
    inset 0 -1px 0 rgba(255,210,228,.52),
    0 5px 15px rgba(160,40,90,.07),
    0 0 0 1px rgba(255,159,190,.12);
  cursor:pointer;transition:transform .18s ease;
}
.fav-item:active{transform:scale(.985)}
.fav-item .fi-note{
  font-size:9px;color:var(--pink-600);font-weight:700;margin-top:2px;
  display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;
}
.fav-item .fi-tags{display:flex;gap:3px;flex-wrap:wrap;margin-top:3px}
.fav-item .fi-tag{
  font-size:8.5px;font-weight:700;padding:2px 6px;border-radius:var(--radius-full);
  background:var(--pink-100);color:var(--pink-700);
}
.fav-item .fi-del{
  width:24px;height:24px;border-radius:50%;border:none;cursor:pointer;flex-shrink:0;
  background:rgba(240,86,141,.15);color:var(--pink-600);
  display:flex;align-items:center;justify-content:center;font-size:12px;
}

/* 我的页面 */
.profile-page{padding:12px 14px}
.prof-card{
  background:
    var(--glass-aurora),
    rgba(255,255,255,.72);
  backdrop-filter:blur(30px) saturate(2.0);-webkit-backdrop-filter:blur(30px) saturate(2.0);
  border:1px solid rgba(255,255,255,.88);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.98),
    inset 0 -1px 0 rgba(255,210,228,.55),
    0 10px 28px rgba(160,40,90,.10);
  border-radius:22px;padding:18px;margin-bottom:14px;
  display:flex;align-items:center;gap:14px;
}
.prof-ava{
  width:64px;height:64px;border-radius:50%;flex-shrink:0;
  background:linear-gradient(150deg,var(--pink-400),var(--pink-600));
  box-shadow:inset 0 2px 0 rgba(255,255,255,.5),0 10px 24px rgba(240,86,141,.28);
  display:flex;align-items:center;justify-content:center;
  font-size:28px;font-weight:900;color:#fff;
}
.prof-info{flex:1}
.prof-info h{font-size:17px;font-weight:900;color:var(--ink-900)}
.prof-info p{font-size:12px;color:var(--ink-500);margin-top:3px}
.prof-stats{display:flex;gap:6px;margin-bottom:14px}
.prof-stat{
  flex:1;text-align:center;padding:14px 8px;border-radius:16px;
  background:
    var(--glass-aurora),
    rgba(255,255,255,.66);
  backdrop-filter:blur(22px) saturate(1.9);-webkit-backdrop-filter:blur(22px) saturate(1.9);
  border:1px solid rgba(255,255,255,.86);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.98),
    0 5px 15px rgba(160,40,90,.07);
}
.prof-stat b{display:block;font-size:18px;font-weight:900;color:var(--pink-600)}
.prof-stat span{display:block;font-size:10px;color:var(--ink-300);font-weight:600;margin-top:2px}
.prof-menu{display:flex;flex-direction:column;gap:6px}
.prof-menu-item{
  display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;cursor:pointer;
  background:rgba(255,255,255,.6);
  backdrop-filter:blur(22px) saturate(1.9);-webkit-backdrop-filter:blur(22px) saturate(1.9);
  border:1px solid rgba(255,255,255,.86);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.98),0 4px 12px rgba(160,40,90,.06);
  font-size:13px;font-weight:700;color:var(--ink-700);
  transition:transform .15s ease;
}
.prof-menu-item:active{transform:scale(.98)}
.prof-menu-item .pi-icon{font-size:18px}
.prof-menu-item .pi-val{margin-left:auto;font-size:11px;color:var(--ink-300);font-weight:600}

/* TabBar 隐藏（扭蛋机页面） */
.tabbar.hidden-tabbar{
  transform:translateY(calc(100% + 20px));
  transition:transform .35s cubic-bezier(.2,.9,.2,1);
  pointer-events:none;
}

/* 搜索无结果提示 */
.search-empty{
  padding:30px 20px;text-align:center;color:var(--ink-300);
}

const GRADS = [

  ['#FCEFF4','#FFF1DC'],['#FFF3F7','#FFEDE0'],['#FFEBF2','#FFF4E8']

/* ========== 菜品配图映射（AI 生成 · 波点食光系列） ========== */

  {kws:['肉夹馍','脆皮肉夹馍','肉夹蛋','蛋夹馍','腊汁'], img:'./assets/dish-04-roujiamo.jpg'},

  {kws:['粥','豆浆','豆汁','黑米粥','小米粥','八宝粥','绿豆汤','南瓜粥','皮蛋瘦肉','椰奶','牛奶','酸奶','奶茶','饮品','饮料','果汁','咖啡','可乐','雪碧','柠檬','酸梅汤','冰粉','布丁','奶昔'], img:'./assets/dish-02-beef-soup.jpg'},
  {kws:['火烧','泰安火烧','里脊饼','蛋肠饼','卷饼','卷煎饼','菜煎饼','烤冷面','月亮馍','鸡蛋灌饼','煎饼果子','杂粮煎饼','手抓饼','葱花饼','油饼','葱油饼','酱香饼','千层饼','公婆饼','武大郎','烧饼'], img:'./assets/dish-06-maiduo-pie.jpg'},
  {kws:['麻辣香锅','麻辣烫','冒菜','串串','关东煮','火锅','钵钵鸡'], img:'./assets/dish-05-banmian.jpg'},
  {kws:['煎饼','煎饺','生煎','锅贴','烙饼','灌汤包','小笼包'], img:'./assets/dish-07-steamed-bun.jpg'},
  {kws:['炸鸡','汉堡','薯条','鸡柳','鸡排','鸡米花','炸串','烧烤','烤串','烤肉','炸货'], img:'./assets/dish-08-teriyaki-rice.jpg'},
  {kws:['寿司','紫菜包饭','饭团','便当','日韩','料理'], img:'./assets/dish-08-teriyaki-rice.jpg'},

function imgOf(d){
  if(!d || !d.name)return null;
  const n = d.name;
  for(const m of DISH_IMG_MAP){
    for(const k of m.kws){ if(n.includes(k)) return m.img; }
  }
  return null;
}

let MENU=null; let CUSTOM=[]; let DEL=new Set();
let FAVORITES=new Set(); let NOTES={};
let favDishes = [];
let S = {
  view:'menu', sub:'1F', edit:false, tab:'floor',
  picks:[], search:''
};

/* ========== INIT ========== */
(async function init(){
  try{ MENU = await (await fetch('./data/menu.json')).json(); }
  catch(e){ MENU={floors:[],shops_outside:[]}; }
  try{
    CUSTOM = JSON.parse(localStorage.getItem('dot_custom')||'[]');
    DEL = new Set(JSON.parse(localStorage.getItem('dot_del')||'[]'));
    FAVORITES = new Set(JSON.parse(localStorage.getItem('dot_favorites')||'[]'));
    NOTES = JSON.parse(localStorage.getItem('dot_notes')||'{}');
  }catch(e){}
  // Service Worker: 加时间戳 cache-bust + 发现新版本立即 SKIP_WAITING 并刷新
  if('serviceWorker' in navigator){
    const SW_VER = '?v=v7-search-fav-notes-20260823';
    navigator.serviceWorker.register('./sw.js' + SW_VER).then(reg => {
      // 发现更新后立即激活（跳过等待），下次访问就是新版本
      if (reg.waiting) reg.waiting.postMessage('SKIP_WAITING');
      reg.addEventListener('updatefound', () => {
        const nw = reg.installing;
        if (!nw) return;
        nw.addEventListener('statechange', () => {
          if (nw.state === 'installed' && navigator.serviceWorker.controller) {
            nw.postMessage('SKIP_WAITING');
            // 直接刷新一次让用户看到新版本
            try { location.reload(); } catch(e) {}
          }
        });
      });
      // 每次启动主动检查一次 SW 是否有更新
      try { reg.update(); } catch(e) {}
    }).catch(()=>{});

    // 上一个版本的 SW 激活了：claim 完成后刷新一下页面
    let refreshing = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!refreshing) { refreshing = true; try { location.reload(); } catch(e) {} }
    });
  }
  renderSeg(); renderChips(); renderList(); renderFavorites(); renderProfile(); bindSearch(); updateTabbar(); updateGachaBadge();
})();

/* ========== HELPERS ========== */
function all(){
  const r=[];
  MENU.floors.forEach(f=>{
    f.shops.forEach(s=>{
      if(s.name.includes('暂停营业'))return;
      s.categories.forEach(c=>{
        c.dishes.forEach(d=>{
          if(DEL.has(d.id)||!d.price)return;
          r.push({...d,floor:f.id,floorName:f.name,shopName:s.name,shopId:s.id,catName:c.name});
        });
      });
    });
  });
  CUSTOM.forEach(d=>r.push({...d,custom:true}));
  return r;
}
function catOf(d){
  for(const c of CATS){
    for(const k of c.kws){
      if((d.name||'').includes(k)||(d.catName||'').includes(k))return c;
    }
  }
  return {name:'其他',emoji:'🍽️'};
}
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(toast._t);
  toast._t=setTimeout(()=>t.classList.remove('show'),1700);
}
function updateTabbar(){
  document.querySelectorAll('.tb-item').forEach(el=>{
    el.classList.toggle('on', el.dataset.v===S.view);
  });
  if(S.edit){
    document.getElementById('editBtn').classList.add('on');
  } else {
    document.getElementById('editBtn').classList.remove('on');
  }
  updateGachaBadge();
}
function enter(){
  document.getElementById('welcome').classList.add('fade');
  setTimeout(()=>{
    document.getElementById('welcome').style.display='none';
    document.getElementById('app').style.display='flex';
    document.getElementById('tb').classList.remove('hidden-tabbar');
  },550);
}

/* ========== SEG + CHIPS ========== */
function renderSeg(){
  const el=document.getElementById('seg');
  const items = MENU.floors.map(f=>({
    id:f.id,label:f.name,
    sub:all().filter(d=>d.floor===f.id).length+' 道'
  }));
  el.innerHTML = items.map(it=>`
    <button data-id="${it.id}" class="${S.tab==='floor'&&S.sub===it.id?'on':''}"
      onclick="switchFloor('${it.id}')">
      ${it.label}<small>${it.sub}</small>
    </button>`).join('');
}
function switchFloor(id){
  S.tab='floor';S.sub=id;renderSeg();renderChips();renderList();
}
function renderChips(){
  const el=document.getElementById('chips');
  let items=[];
  if(S.tab==='floor'){
    // 添加子档口 chips
    const f = MENU.floors.find(x=>x.id===S.sub);
    if(f && S.sub.length<=3){
      items = f.shops.filter(s=>!s.name.includes('暂停营业')).map(s=>{
        const short = s.name.replace(/^[一二三四五六七八九十0-9]+号\s*/,'').slice(0,8);
        return {id:s.id,name:short};
      });
      items.unshift({id:':all',name:'全部'});
    } else {
      // 已经是具体档口
      const f = MENU.floors.find(x=>S.sub.startsWith(x.id));
      if(f){
        items = f.shops.filter(s=>!s.name.includes('暂停营业')).map(s=>{
          const short = s.name.replace(/^[一二三四五六七八九十0-9]+号\s*/,'').slice(0,8);
          return {id:s.id,name:short};
        });
        items.unshift({id:':all',name:'全部'});
      }
    }
  } else if(S.tab==='cat'){
    items = CATS.map(c=>({id:c.name,name:c.emoji+' '+c.name}));
  } else {
    items = PRICE_TIERS.map(t=>({id:t.name,name:t.emoji+' '+t.name}));
  }
  const cur = (S.tab==='floor' && S.sub.length>3) ? S.sub : (S.tab==='floor'?':all':S.sub);
  el.innerHTML = items.map(it=>`
    <button class="chip ${it.id===cur?'on':''}" onclick="pickChip('${S.tab}','${it.id}')">${it.name}</button>
  `).join('');
}
function pickChip(tab,id){
  S.tab=tab;
  if(tab==='floor'){
    if(id===':all'){
      // 回到楼层概览，取当前 sub 的 floor prefix
      const floorId = (S.sub.length>3)? S.sub.slice(0,2): S.sub;
      S.sub = floorId;
    } else S.sub = id;
  } else S.sub = id;
  renderSeg();renderChips();renderList();
}
function switchTab(v){
  if(v==='menu'){
    if(S.edit)return toggleEdit();
    S.view='menu';S.tab='floor';S.sub='1F';
    document.getElementById('pageTitle').textContent='今天想吃点什么呀？';
    showView('viewMenu');
    document.getElementById('app').scrollTop=0;
    renderSeg();renderChips();renderList();
  } else if(v==='favorites'){
    if(S.edit)toggleEdit();
    S.view='favorites';
    document.getElementById('pageTitle').textContent='我的收藏清单 💗';
    showView('viewFavorites');
    renderFavorites();
  } else if(v==='profile'){
    if(S.edit)toggleEdit();
    S.view='profile';
    document.getElementById('pageTitle').textContent='呆呆大王的小馆';
    showView('viewProfile');
    renderProfile();
  }
  updateTabbar();
}
function showView(id){
  ['viewMenu','viewFavorites','viewProfile'].forEach(v=>{
    document.getElementById(v).style.display = v===id?'':'none';
  });
}
function updateGachaBadge(){
  const b = document.getElementById('gachaBadge');
  if(S.picks.length>0){
    b.style.display='flex';
    b.textContent = S.picks.length;
  } else {
    b.style.display='none';
  }
}

/* ========== LIST ========== */
function renderList(){
  const list = document.getElementById('list');
  const sn = document.getElementById('secName');
  const ss = document.getElementById('secStat');
  let pool = all();
  let filtered = [];
  let grouped = null;
  const searchQ = S.search.trim().toLowerCase();

  if(S.tab==='floor'){
    if(S.sub.length<=3){
      const f = MENU.floors.find(x=>x.id===S.sub);
      sn.textContent = f ? f.name+'菜单' : '菜单';
      filtered = pool.filter(d=>d.floor===S.sub);
      if(searchQ){
        filtered = filtered.filter(d=>{
          const n = (d.name||'').toLowerCase();
          const s = (d.shopName||'').toLowerCase();
          return n.includes(searchQ) || s.includes(searchQ);
        });
        sn.textContent = '"'+S.search+'" 的搜索结果';
      }
      ss.textContent = filtered.length+' 道';
      const g = {};
      filtered.forEach(d=>{ (g[d.shopId]??=[]).push(d); });
      if(!searchQ){
        const order = MENU.floors.flatMap(f=>f.shops.filter(s=>!s.name.includes('暂停营业')).map(s=>s.id));
        grouped = Object.keys(g).sort((a,b)=>order.indexOf(a)-order.indexOf(b)).map(id=>({
          id,
          title:g[id][0].shopName.replace(/^[一二三四五六七八九十0-9]+号\s*/,''),
          idx: (id.match(/_(\d+)$/)||[])[1] || '',
          list:g[id]
        }));
      }
    } else {
      filtered = pool.filter(d=>d.shopId===S.sub);
      if(searchQ){
        filtered = filtered.filter(d=>(d.name||'').toLowerCase().includes(searchQ));
      }
      sn.textContent = filtered[0]?.shopName.replace(/^[一二三四五六七八九十0-9]+号\s*/,'') || '';
      ss.textContent = filtered.length+' 道';
    }
  } else if(S.tab==='cat'){
    const c = CATS.find(x=>x.name===S.sub) || {name:S.sub};
    sn.textContent = c.name;
    filtered = pool.filter(d=>catOf(d).name===S.sub);
    if(searchQ){
      filtered = filtered.filter(d=>(d.name||'').toLowerCase().includes(searchQ));
      sn.textContent = '"'+S.search+'" 的搜索结果';
    }
    ss.textContent = filtered.length+' 道';
  } else {
    const t = PRICE_TIERS.find(x=>x.name===S.sub);
    sn.textContent = t.name;
    filtered = pool.filter(d=>{
      const p = d.price?.min_price ?? 999;
      if(t.max!==undefined && p>=t.max)return false;
      if(t.min!==undefined && p<t.min)return false;
      return true;
    });
    if(searchQ){
      filtered = filtered.filter(d=>(d.name||'').toLowerCase().includes(searchQ));
      sn.textContent = '"'+S.search+'" 的搜索结果';
    }
    ss.textContent = filtered.length+' 道';
  }

  let html='';
  if(filtered.length===0){
    if(searchQ){
      html = `<div class="search-empty"><div class="se-icon">🔍</div><p>没有找到"<b style="color:var(--pink-600)">${S.search}</b>"相关的菜<br/>换个关键词试试？</p></div>`;
    } else {
      html = `<div class="empty"><div class="ei">🫧</div><p>这里还没有菜品<br/>点顶栏铅笔图标进入编辑模式添加吧～</p></div>`;
    }
  } else if(grouped){
    grouped.forEach(g=>{
      html += `<div class="shop-h">
        <b>${g.idx?g.idx:'·'}</b>
        <div class="st">${g.title}</div>
        <div class="sc">${g.list.length} 道</div>
      </div>`;
      html += cardList(g.list);
      html += `<div class="gap"></div>`;
    });
  } else {
    html += cardList(filtered);
  }
  list.innerHTML = html;
  list.style.paddingTop = grouped?'4px':'0';
  bindCards();
  document.getElementById('app').classList.toggle('edit-mode',S.edit);
}
function cardList(arr){
  let h='';
  arr.forEach((d,i)=>{
    const c = catOf(d);
    const [g1,g2] = GRADS[i%GRADS.length];
    const shopShort = (d.shopName||'').replace(/^[一二三四五六七八九十0-9]+号\s*/,'').slice(0,9);
    const price = d.price?.display || '';
    const floorBadge = d.floor==='1F'?'一楼':'二楼';
    const img = imgOf(d);
    const thumbHTML = img
      ? `<div class="thumb" style="padding:0;background:#fff"><img src="${img}" alt="${d.name}" style="width:100%;height:100%;object-fit:cover;display:block"></div>`
      : `<div class="thumb" style="background:linear-gradient(135deg,${g1},${g2})">${c.emoji}</div>`;
    h += `<div class="dish" data-id="${d.id}" data-custom="${d.custom?1:0}">
      <button class="del-x" data-id="${d.id}" data-custom="${d.custom?1:0}">×</button>
      ${thumbHTML}
      <div class="info">
        <div class="dname">${d.name}</div>
        <div class="ddesc">${floorBadge} · ${shopShort}</div>
      </div>
      <div class="price"><em>¥</em>${price.replace('元','')}</div>
    </div>`;
  });
  return h;
}
function bindCards(){
  document.querySelectorAll('#list .dish').forEach(c=>{
    c.onclick = e=>{
      if(S.edit)return;
      const id=c.dataset.id,custom=c.dataset.custom==='1';
      const d = custom? CUSTOM.find(x=>x.id===id):all().find(x=>x.id===id);
      if(d)showDetail(d);
    };
  });
  document.querySelectorAll('.del-x').forEach(b=>{
    b.onclick = e=>{
      e.stopPropagation();
      delDish(b.dataset.id,b.dataset.dataset?b.dataset.custom:b.getAttribute('data-custom'));
    };
  });
}

function openGacha(){

}
function closeGacha(){
  document.getElementById('gacha').classList.remove('open');
  document.getElementById('tb').classList.remove('hidden-tabbar');
}

function refreshGacha(){
  document.getElementById('gc').textContent = S.picks.length;
  const hint = document.getElementById('gHint');
  if(S.picks.length>=5){
    hint.textContent='5 次扭完啦，查看结果或再扭一轮～';
    document.getElementById('gBtn').textContent='再扭一轮 ↻';
  } else {
    hint.textContent='最多 5 次，扭完在底部栏挑最终答案';
    document.getElementById('gBtn').innerHTML = `
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
      扭一扭`;
  }
  document.getElementById('gBtn').disabled = false;
  // 扭蛋记录
  if(S.picks.length>0){
    document.getElementById('gHist').style.display='block';
    document.getElementById('gHistN').textContent = S.picks.length + ' 道';
    document.getElementById('gHistRows').innerHTML = S.picks.slice().reverse().map((p,i)=>{
      const no = S.picks.length - i;
      return `<div class="ghr">
        <span>#${no} · ${p.name}</span>
        <em>¥${(p.price?.display||'').replace('元','')}</em>
      </div>`;
    }).join('');
  }
}
function spinGacha(){
  const btn = document.getElementById('gBtn');
  if(btn.disabled)return;
  // 如果已经 5 次，按钮变成"再扭一轮"
  if(S.picks.length>=5){
    if(!confirm('清空已扭的 5 个结果？'))return;
    S.picks=[];updatePicks();
    // 清空结果卡片
    document.getElementById('gResult').classList.remove('show');
    document.getElementById('gHist').style.display='none';
    refreshGacha();
    return;
  }
  btn.disabled = true;
  const dome = document.getElementById('gDome');
  const knob = document.getElementById('gKnob');
  dome.classList.remove('shake');void dome.offsetWidth;dome.classList.add('shake');
  knob.classList.remove('spin');void knob.offsetWidth;knob.classList.add('spin');

  // 动画期间随机挑一个胶囊"弹出去"
  const caps = ['c1','c2','c3','c4','c5'];
  const popId = caps[Math.floor(Math.random()*caps.length)];
  setTimeout(()=>{
    document.getElementById(popId).classList.add('pop');
  },350);

  setTimeout(()=>{
    // 选菜
    const pool = all();
    const d = pool[Math.floor(Math.random()*pool.length)];
    S.picks.push(d);
    // 展示结果
    const c = catOf(d);
    document.getElementById('gRip').textContent = c.emoji;
    document.getElementById('gN').textContent = d.name;
    document.getElementById('gS').textContent = 
      `${d.floor==='1F'?'一楼':'二楼'} · ${(d.shopName||'自定义').replace(/^[一二三四五六七八九十0-9]+号\s*/,'').slice(0,8)}`;
    document.getElementById('gP').innerHTML = `<em>¥</em>${(d.price?.display||'').replace('元','')}`;
    const r = document.getElementById('gResult');
    r.classList.remove('show');void r.offsetWidth;r.classList.add('show');
    // 复原胶囊
    caps.forEach(id=>{const el=document.getElementById(id);if(el)el.classList.remove('pop');});
    updatePicks();refreshGacha();
  },900);
}

/* ========== NOTES ========== */
const NOTE_TAG_LABELS = {good:'好吃👍',bad:'难吃👎',ok:'一般😐',rec:'推荐🌟',norec:'不推荐💔'};
function toggleNoteTag(id,key,custom){
  if(!NOTES[id]) NOTES[id] = {tags:[], text:''};
  const idx = NOTES[id].tags.indexOf(key);
  if(idx>=0){
    NOTES[id].tags.splice(idx,1);
  } else {
    NOTES[id].tags.push(key);
  }
  localStorage.setItem('dot_notes', JSON.stringify(NOTES));
  showDetail(custom? CUSTOM.find(x=>x.id===id):all().find(x=>x.id===id));
}
function saveNoteText(id,custom,val){
  if(!NOTES[id]) NOTES[id] = {tags:[], text:''};
  NOTES[id].text = val;
  localStorage.setItem('dot_notes', JSON.stringify(NOTES));
  updateNoteCount(id);
}
function updateNoteCount(id){
  const el = document.getElementById('noteCount');
  if(!el) return;
  const n = NOTES[id];
  let parts = [];
  if(n && n.tags && n.tags.length>0) parts.push(n.tags.length+' 标签');
  if(n && n.text && n.text.trim()) parts.push('有文字');
  el.textContent = parts.length>0 ? '· '+parts.join(' · ') : '';
}

/* ========== FAVORITES PAGE ========== */
function renderFavorites(){
  const list = document.getElementById('favList');
  const count = document.getElementById('favCount');
  const favArr = [...FAVORITES];
  count.textContent = favArr.length>0? favArr.length+' 道' : '';

  if(favArr.length===0){
    list.innerHTML = `<div class="empty" style="padding:40px 20px"><div class="ei">💗</div><p>还没有收藏的菜品<br/>去菜单页爱心收藏喜欢的菜吧～</p></div>`;
    favDishes = [];
    return;
  }

  const allPool = all();
  favDishes = [];
  let html = '';
  favArr.forEach(id=>{
    const d = CUSTOM.find(x=>x.id===id) || allPool.find(x=>x.id===id);
    if(!d) return;
    favDishes.push(d);
    const c = catOf(d);
    const note = NOTES[id];
    const noteText = note?.text || '';
    const noteTags = (note?.tags||[]).map(k=>NOTE_TAG_LABELS[k]||k);
    const price = d.price?.display || '';
    const shopShort = (d.shopName||'').replace(/^[一二三四五六七八九十0-9]+号\s*/,'').slice(0,8);
    const idx = favDishes.length - 1;
    html += `<div class="fav-item" onclick="showDetail(favDishes[${idx}])">
      <div class="thumb" style="width:44px;height:44px;font-size:19px">${c.emoji}</div>
      <div class="info" style="flex:1;min-width:0">
        <div class="dname">${d.name}</div>
        <div class="ddesc">${d.floor==='1F'?'一楼':'二楼'} · ${shopShort} · ¥${price.replace('元','')}</div>
        ${noteTags.length>0? `<div class="fi-tags">${noteTags.map(t=>`<span class="fi-tag">${t}</span>`).join('')}</div>`:''}
        ${noteText? `<div class="fi-note">📝 ${noteText}</div>`:''}
      </div>
      <button class="fi-del" onclick="event.stopPropagation();removeFav('${id}')">×</button>
    </div>`;
  });
  list.innerHTML = html;
}
function removeFav(id){
  FAVORITES.delete(id);
  localStorage.setItem('dot_favorites', JSON.stringify([...FAVORITES]));
  toast('已从收藏中移除 💔');
  renderFavorites();
  updateGachaBadge();
}

/* ========== PROFILE PAGE ========== */
function renderProfile(){
  const el = document.getElementById('profilePage');
  const totalDishes = all().length;
  const favCount = FAVORITES.size;
  const noteCount = Object.values(NOTES).filter(n=>n.text||(n.tags&&n.tags.length>0)).length;
  const customCount = CUSTOM.length;

  el.innerHTML = `
    <div class="prof-card">
      <div class="prof-ava">呆</div>
      <div class="prof-info">
        <h>呆呆大王</h>
        <p>今天也要好好吃饭呀 💗</p>
      </div>
    </div>

    <div class="prof-stats">
      <div class="prof-stat"><b>${totalDishes}</b><span>总菜品</span></div>
      <div class="prof-stat"><b>${favCount}</b><span>已收藏</span></div>
      <div class="prof-stat"><b>${noteCount}</b><span>有备注</span></div>
      <div class="prof-stat"><b>${customCount}</b><span>我添加的</span></div>
    </div>

    <div class="prof-menu">
      <div class="prof-menu-item" onclick="switchTab('favorites')">
        <span class="pi-icon">💗</span>
        我的收藏清单
        <span class="pi-val">${favCount} 道</span>
      </div>
      <div class="prof-menu-item" onclick="exportData()">
        <span class="pi-icon">📤</span>
        导出我的数据
      </div>
      <div class="prof-menu-item" onclick="clearAllData()">
        <span class="pi-icon">🗑️</span>
        清除所有本地数据
      </div>
    </div>
  `;
}
function exportData(){
  const data = {
    favorites: [...FAVORITES],
    notes: NOTES,
    custom: CUSTOM,
    exportTime: new Date().toISOString()
  };
  const str = JSON.stringify(data, null, 2);
  navigator.clipboard.writeText(str).then(()=>{
    toast('数据已复制到剪贴板 📋');
  }).catch(()=>{
    sheetHTML(`<h2 style="font-size:18px;font-weight:900;margin-bottom:12px">导出数据</h2>
      <textarea readonly style="width:100%;min-height:200px;padding:10px;border-radius:12px;border:1.5px solid var(--pink-100);font-size:11px;font-family:monospace;background:var(--pink-50)">${str}</textarea>
      <div class="srow" style="margin-top:12px"><button class="b-ok" onclick="closeSheet()">关闭</button></div>`);
  });
}
function clearAllData(){
  if(!confirm('确定要清除所有本地数据吗？\n（收藏、备注、自定义菜品都将清除）'))return;
  FAVORITES.clear();
  NOTES = {};
  CUSTOM = [];
  localStorage.setItem('dot_favorites','[]');
  localStorage.setItem('dot_notes','{}');
  localStorage.setItem('dot_custom','[]');
  toast('已清除所有数据 🧹');
  renderProfile();
  updateGachaBadge();
}

/* ========== GACHA BOTTOM BAR ========== */
function viewResults(){
  if(S.picks.length===0){
    toast('还没扭任何菜哦，先扭一扭吧～');
    return;
  }
  closeGacha();
  finalView();
}
function clearGacha(){
  if(S.picks.length===0){
    toast('还没有扭任何菜哦～');
    return;
  }
  if(!confirm('确定要清空已扭的结果吗？'))return;
  S.picks=[];
  updatePicks();
  document.getElementById('gResult').classList.remove('show');
  document.getElementById('gHist').style.display='none';
  refreshGacha();
  toast('已清空，重新开始 🎀');
}
</script>
</body>
</html>
