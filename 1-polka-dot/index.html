<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小媛的食堂指南 · 波点食光</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="splash-screen" id="splashScreen">
        <div class="splash-content">
            <div class="splash-dots"><span></span><span></span><span></span><span></span><span></span></div>
            <div class="splash-icon"><i class="fas fa-dice"></i></div>
            <h1 class="splash-title">小媛的食堂指南</h1>
            <p class="splash-subtitle">· 波点食光 ·</p>
            <div class="splash-dots-bottom"><span></span><span></span><span></span><span></span><span></span></div>
        </div>
    </div>
    <div class="loading"><div class="loading-spinner"></div></div>
    <div class="container">
        <header class="header">
            <h1 class="title"><i class="fas fa-utensils"></i>小媛的食堂</h1>
            <p class="subtitle">今天吃什么？让命运来决定～</p>
        </header>
        <main class="main-content">
            <div class="food-display">
                <div class="food-card" id="foodCard">
                    <div class="food-icon"><i class="fas fa-question"></i></div>
                    <h2 class="food-name" id="foodName">点击开始随机</h2>
                    <p class="food-description" id="foodDescription">准备好接受美食的召唤了吗？</p>
                </div>
            </div>
            <div class="controls">
                <button class="btn btn-primary" id="randomBtn"><i class="fas fa-random"></i>随机选择</button>
                <button class="btn btn-secondary" id="addFoodBtn"><i class="fas fa-plus"></i>添加食物</button>
                <button class="btn btn-secondary" id="resetBtn"><i class="fas fa-redo"></i>重置列表</button>
            </div>
            <div class="food-list-section">
                <h3>当前食物列表</h3>
                <div class="food-list" id="foodList"></div>
            </div>
        </main>
        <div class="modal" id="addFoodModal">
            <div class="modal-content">
                <div class="modal-header"><h3>添加新食物</h3><button class="close-btn" id="closeModal"><i class="fas fa-times"></i></button></div>
                <div class="modal-body">
                    <div class="form-group"><label>食物名称</label><input type="text" id="foodNameInput" placeholder="例如：宫保鸡丁"></div>
                    <div class="form-group"><label>描述（可选）</label><textarea id="foodDescriptionInput" placeholder="例如：经典川菜，酸甜微辣"></textarea></div>
                    <div class="form-group"><label>分类（可选）</label><select id="foodCategoryInput"><option value="">选择分类</option><option value="主食">主食</option><option value="炒菜">炒菜</option><option value="汤品">汤品</option><option value="凉菜">凉菜</option><option value="特色">特色</option></select></div>
                </div>
                <div class="modal-footer"><button class="btn btn-secondary" id="cancelAdd">取消</button><button class="btn btn-primary" id="confirmAdd">添加</button></div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
